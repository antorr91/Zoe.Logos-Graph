<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe.Logos-Graph — Literature Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--surface:#161820;--surface2:#1e2028;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#e8e9ec;--muted:#7a7e8a;--hint:#454854;--amber:#e8a427;--amber-dim:rgba(232,164,39,0.12);--teal:#2cb88a;--teal-dim:rgba(44,184,138,0.12);--violet:#9b8ef0;--violet-dim:rgba(155,142,240,0.12);--blue:#5b9cf6;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(14,15,17,0.85);backdrop-filter:blur(16px)}
.logo{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);text-decoration:none;letter-spacing:-0.02em}
.logo .a{color:var(--amber)}
.logo-sub{font-size:11px;color:var(--muted);font-weight:300;margin-left:8px;font-family:'DM Sans',sans-serif}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.nav-links a:hover{color:var(--text)}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 57px)}
.sidebar{border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;position:sticky;top:57px;height:calc(100vh - 57px)}
.main{padding:1.5rem 2rem;max-width:900px}

.sidebar h3{font-size:10px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;margin-top:1.25rem}
.sidebar h3:first-child{margin-top:0}

input[type=text],select{width:100%;font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;margin-bottom:.5rem}
input[type=text]:focus,select:focus{border-color:rgba(232,164,39,.5)}
input::placeholder{color:var(--hint)}
select option{background:var(--surface)}

.chip-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.75rem}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--hint);cursor:pointer;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.chip:hover,.chip.on{color:var(--amber);border-color:rgba(232,164,39,.4);background:var(--amber-dim)}
.chip.teal.on{color:var(--teal);border-color:rgba(44,184,138,.4);background:var(--teal-dim)}
.chip.violet.on{color:var(--violet);border-color:rgba(155,142,240,.4);background:var(--violet-dim)}

.stat-row{display:flex;gap:8px;margin-bottom:1rem}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat-n{font-family:'DM Mono',monospace;font-size:20px;color:var(--amber);display:block}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{font-size:13px;padding:8px 16px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'DM Sans',sans-serif}
.tab:hover{color:var(--text)}.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

/* Paper cards */
.paper-list{display:flex;flex-direction:column;gap:0}
.pc{border-bottom:1px solid var(--border);padding:16px 0}
.pc:last-child{border-bottom:none}
.pc-title{font-size:14px;font-weight:400;color:var(--blue);margin-bottom:4px;cursor:pointer;text-decoration:none;display:block;line-height:1.4}
.pc-title:hover{text-decoration:underline}
.pc-meta{font-size:11px;color:var(--hint);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pc-journal{color:var(--muted);font-style:italic}
.pc-outcome{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px;font-weight:300;font-style:italic}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ptag{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid}
.ptag-v{color:var(--amber);border-color:rgba(232,164,39,.3);background:var(--amber-dim)}
.ptag-c{color:var(--teal);border-color:rgba(44,184,138,.3);background:var(--teal-dim)}
.ptag-f{color:var(--violet);border-color:rgba(155,142,240,.3);background:var(--violet-dim)}
.ptag-m{color:var(--muted);border-color:var(--border);background:var(--surface2)}
.pc-actions{display:flex;gap:6px;flex-wrap:wrap}
.pact{font-size:11px;padding:3px 9px;border:1px solid var(--border2);border-radius:4px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block}
.pact:hover{color:var(--amber);border-color:rgba(232,164,39,.4)}
.oa-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--teal-dim);color:var(--teal);border:1px solid rgba(44,184,138,.3)}

/* Evidence matrix */
.matrix-wrap{overflow-x:auto;margin-bottom:1.5rem}
.matrix{border-collapse:collapse;width:100%;font-size:11px}
.matrix th{background:var(--surface);border:1px solid var(--border);padding:8px 10px;text-align:left;font-weight:500;color:var(--muted);white-space:nowrap;position:sticky;top:0}
.matrix td{border:1px solid var(--border);padding:7px 10px;color:var(--text);vertical-align:top}
.matrix tr:hover td{background:var(--surface2)}
.cell-yes{color:var(--teal);font-weight:500}
.cell-no{color:var(--hint)}
.conf-bar{height:3px;border-radius:2px;background:rgba(232,164,39,.3);margin-top:3px}
.conf-fill{height:3px;border-radius:2px;background:var(--amber)}

/* Empty state */
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px;font-weight:300}
.empty code{font-family:'DM Mono',monospace;font-size:11px;color:var(--amber);background:var(--surface);padding:2px 6px;border-radius:4px}
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:13px}

/* Export popup */
.epop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center}
.ebox{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:1.5rem;max-width:480px;width:90%}
.ebox h3{font-size:15px;font-weight:500;color:var(--text);margin-bottom:1rem}
.ebox p{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:1rem}
.ebox code{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);background:var(--bg);border-radius:8px;padding:12px;margin-bottom:1rem;white-space:pre-wrap;word-break:break-all}
.ebtns{display:flex;gap:8px}
.eb{font-size:12px;padding:7px 16px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.ebp{background:var(--amber);color:#0e0f11}.ebg{background:none;border:1px solid var(--border2);color:var(--muted)}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <span>Zoe<span class="a">.</span>Logos<span class="a">-</span>Graph</span>
    <span class="logo-sub">v0.4</span>
  </a>
  <div class="nav-links">
    <a href="index.html">home</a>
    <a href="species.html">species</a>
    <a href="literature.html" style="color:var(--text)">literature</a>
  </div>
</nav>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h3>search</h3>
  <input type="text" id="q-title" placeholder="title keyword…">
  <input type="text" id="q-species" placeholder="species name…">

  <h3>class</h3>
  <div class="chip-group" id="filter-class"></div>

  <h3>vocalisation type</h3>
  <div class="chip-group" id="filter-voc"></div>

  <h3>function</h3>
  <div class="chip-group" id="filter-fn"></div>

  <h3>year range</h3>
  <div style="display:flex;gap:6px">
    <input type="text" id="q-year-from" placeholder="from" style="width:50%">
    <input type="text" id="q-year-to" placeholder="to" style="width:50%">
  </div>

  <h3>source</h3>
  <div class="chip-group">
    <button class="chip on" data-src="all">all</button>
    <button class="chip" data-src="pubmed">PubMed</button>
    <button class="chip" data-src="pilot">pilot</button>
    <button class="chip" data-src="crossref">Crossref</button>
    <button class="chip" data-src="openalex">OpenAlex</button>
  </div>

  <h3>open access only</h3>
  <div class="chip-group">
    <button class="chip on" data-oa="all">all</button>
    <button class="chip teal" data-oa="oa">🔓 OA only</button>
  </div>

  <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)">
    <button class="pact" style="width:100%;padding:8px;text-align:center" onclick="showExportHelp()">
      generate review ↗
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="stat-row" id="stats">
    <div class="stat"><span class="stat-n" id="st-papers">—</span><span class="stat-l">papers</span></div>
    <div class="stat"><span class="stat-n" id="st-species">—</span><span class="stat-l">species</span></div>
    <div class="stat"><span class="stat-n" id="st-claims">—</span><span class="stat-l">claims</span></div>
    <div class="stat"><span class="stat-n" id="st-oa">—</span><span class="stat-l">open access</span></div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="stab('papers',this)">papers</button>
    <button class="tab" onclick="stab('matrix',this)">evidence matrix</button>
    <button class="tab" onclick="stab('functions',this)">by function</button>
  </div>

  <div id="tc"><div class="loading">loading…</div></div>
</main>

</div>

<div id="epop" style="display:none" class="epop" onclick="if(event.target===this)this.style.display='none'">
  <div class="ebox">
    <h3>Generate systematic review</h3>
    <p>Run one of these commands in your terminal to generate a structured review document:</p>
    <code id="review-cmds"></code>
    <div class="ebtns">
      <button class="eb ebp" onclick="copyReviewCmds()">Copy commands</button>
      <button class="eb ebg" onclick="document.getElementById('epop').style.display='none'">Close</button>
    </div>
  </div>
</div>

<script>
const DATA_BASE = '../data/built';
let ALL_PAPERS = [];   // from species JSON files
let ALL_CLAIMS = [];   // aggregated claims
let INDEX      = [];   // species index
let activeTab  = 'papers';
let filters    = { title:'', species:'', class:'all', voc:[], fn:[], src:'all', oa:'all', yearFrom:null, yearTo:null };

// ── Load data ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch(`${DATA_BASE}/species_index.json`);
    INDEX = await r.json();
  } catch(e) {
    document.getElementById('tc').innerHTML = `<div class="empty">Could not load species index.<br>Run <code>python scripts/07_export_web.py</code> first.</div>`;
    return;
  }

  // Load all species detail for papers + claims
  const details = await Promise.all(
    INDEX.map(sp => fetch(`${DATA_BASE}/species/${sp.species_id}.json`).then(r=>r.json()).catch(()=>null))
  );

  // Aggregate papers
  const paperMap = new Map();
  for (const sp of details) {
    if (!sp) continue;
    for (const p of (sp.papers || [])) {
      if (!paperMap.has(p.paper_id)) {
        paperMap.set(p.paper_id, {
          ...p,
          species: [],
          vocalisations: [],
          functions: [],
          contexts: [],
          methods: [],
        });
      }
      const rec = paperMap.get(p.paper_id);
      rec.species.push({sci: sp.scientific_name, en: sp.common_name_en, class_: sp.taxonomy?.class_});
    }
    // Add claims to paper records
    for (const p of (sp.papers || [])) {
      const rec = paperMap.get(p.paper_id);
      if (!rec) continue;
      for (const c of (sp.communication_profile?.vocalisations || [])) {
        if (!rec.vocalisations.includes(c.value)) rec.vocalisations.push(c.value);
      }
      for (const c of (sp.communication_profile?.functions || [])) {
        if (!rec.functions.includes(c.value)) rec.functions.push(c.value);
      }
      for (const c of (sp.communication_profile?.contexts || [])) {
        if (!rec.contexts.includes(c.value)) rec.contexts.push(c.value);
      }
      for (const c of (sp.communication_profile?.methods || [])) {
        if (!rec.methods.includes(c.value)) rec.methods.push(c.value);
      }
    }
  }
  ALL_PAPERS = [...paperMap.values()].sort((a,b)=>(b.year||0)-(a.year||0));

  // Aggregate all claims
  const claimMap = new Map();
  for (const sp of details) {
    if (!sp) continue;
    const profile = sp.communication_profile || {};
    for (const [type, list] of Object.entries(profile)) {
      for (const c of (list || [])) {
        const key = `${type}|${c.value}`;
        if (!claimMap.has(key)) claimMap.set(key, {type, value:c.value, species:[], paper_count:0, avg_conf:0});
        const rec = claimMap.get(key);
        rec.species.push({sci:sp.scientific_name, en:sp.common_name_en});
        rec.paper_count += c.evidence_count || 0;
        rec.avg_conf = Math.max(rec.avg_conf, c.confidence || 0);
      }
    }
  }
  ALL_CLAIMS = [...claimMap.values()];

  buildFilterChips();
  updateStats();
  render();
}

// ── Filter chips ──────────────────────────────────────────────────────────────
function buildFilterChips() {
  const classes = [...new Set(INDEX.map(s=>s.class_).filter(Boolean))].sort();
  document.getElementById('filter-class').innerHTML = classes.map(c=>
    `<button class="chip" data-class="${c}" onclick="toggleFilter('class','${c}',this)">${c}</button>`
  ).join('');

  const vocs = [...new Set(ALL_CLAIMS.filter(c=>c.type==='vocalisation').map(c=>c.value))].sort().slice(0,16);
  document.getElementById('filter-voc').innerHTML = vocs.map(v=>
    `<button class="chip" data-voc="${v}" onclick="toggleMulti('voc','${v}',this)">${v}</button>`
  ).join('');

  const fns = [...new Set(ALL_CLAIMS.filter(c=>c.type==='function').map(c=>c.value))].sort().slice(0,16);
  document.getElementById('filter-fn').innerHTML = fns.map(f=>
    `<button class="chip" data-fn="${f}" onclick="toggleMulti('fn','${f}',this)">${f}</button>`
  ).join('');
}

function toggleFilter(key, val, btn) {
  const current = filters[key] === val ? 'all' : val;
  filters[key] = current;
  btn.closest('.chip-group').querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  if (current !== 'all') btn.classList.add('on');
  render();
}
function toggleMulti(key, val, btn) {
  const arr = filters[key];
  const idx = arr.indexOf(val);
  if (idx >= 0) { arr.splice(idx,1); btn.classList.remove('on'); }
  else { arr.push(val); btn.classList.add('on'); }
  render();
}

// Source chips
document.querySelectorAll('[data-src]').forEach(btn => btn.addEventListener('click', () => {
  filters.src = btn.dataset.src;
  document.querySelectorAll('[data-src]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}));
// OA chips
document.querySelectorAll('[data-oa]').forEach(btn => btn.addEventListener('click', () => {
  filters.oa = btn.dataset.oa;
  document.querySelectorAll('[data-oa]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render();
}));
// Text inputs
document.getElementById('q-title').addEventListener('input', e => { filters.title = e.target.value.toLowerCase(); render(); });
document.getElementById('q-species').addEventListener('input', e => { filters.species = e.target.value.toLowerCase(); render(); });
document.getElementById('q-year-from').addEventListener('input', e => { filters.yearFrom = parseInt(e.target.value)||null; render(); });
document.getElementById('q-year-to').addEventListener('input', e => { filters.yearTo = parseInt(e.target.value)||null; render(); });

// ── Filter papers ─────────────────────────────────────────────────────────────
function filterPapers() {
  return ALL_PAPERS.filter(p => {
    if (filters.title && !p.title.toLowerCase().includes(filters.title)) return false;
    if (filters.species) {
      const sps = p.species.map(s=>`${s.sci} ${s.en}`.toLowerCase()).join(' ');
      if (!sps.includes(filters.species)) return false;
    }
    if (filters.class !== 'all') {
      if (!p.species.some(s=>s.class_===filters.class)) return false;
    }
    if (filters.voc.length > 0) {
      if (!filters.voc.some(v=>p.vocalisations.includes(v))) return false;
    }
    if (filters.fn.length > 0) {
      if (!filters.fn.some(f=>p.functions.includes(f))) return false;
    }
    if (filters.src !== 'all' && !p.source?.includes(filters.src)) return false;
    if (filters.oa === 'oa' && !p.open_access) return false;
    if (filters.yearFrom && (p.year||0) < filters.yearFrom) return false;
    if (filters.yearTo && (p.year||0) > filters.yearTo) return false;
    return true;
  });
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const papers = filterPapers();
  const speciesSet = new Set(papers.flatMap(p=>p.species.map(s=>s.sci)));
  const oa = papers.filter(p=>p.open_access).length;
  const claims = papers.reduce((n,p)=>n+p.vocalisations.length+p.functions.length,0);
  document.getElementById('st-papers').textContent  = papers.length;
  document.getElementById('st-species').textContent = speciesSet.size;
  document.getElementById('st-claims').textContent  = claims;
  document.getElementById('st-oa').textContent      = oa;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function stab(name, btn) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); activeTab = name; render();
}

function render() {
  updateStats();
  const tc = document.getElementById('tc');
  if (activeTab === 'papers') tc.innerHTML = renderPapers();
  else if (activeTab === 'matrix') tc.innerHTML = renderMatrix();
  else if (activeTab === 'functions') tc.innerHTML = renderFunctions();
}

function renderPapers() {
  const papers = filterPapers();
  if (!papers.length) return `<div class="empty">No papers match the current filters.</div>`;
  return `<div class="paper-list">` + papers.map(p => {
    const gs = `https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}`;
    const doi_url = p.doi ? `https://doi.org/${p.doi}` : null;
    const sp_label = p.species.slice(0,3).map(s=>`<em>${s.en||s.sci}</em>`).join(', ');
    return `<div class="pc">
      <a class="pc-title" href="${doi_url||gs}" target="_blank">${p.title}</a>
      <div class="pc-meta">
        <span>${p.year||'n.d.'}</span>
        ${p.journal?`<span class="pc-journal">${p.journal}</span>`:''}
        ${p.open_access?`<span class="oa-badge">open access</span>`:''}
        <span>${sp_label}</span>
      </div>
      ${p.main_outcome?`<div class="pc-outcome">"${p.main_outcome}"</div>`:''}
      <div class="pc-tags">
        ${p.vocalisations.slice(0,4).map(v=>`<span class="ptag ptag-v">${v}</span>`).join('')}
        ${p.functions.slice(0,3).map(f=>`<span class="ptag ptag-f">${f}</span>`).join('')}
        ${p.methods.slice(0,2).map(m=>`<span class="ptag ptag-m">${m}</span>`).join('')}
      </div>
      <div class="pc-actions">
        <a class="pact" href="${gs}" target="_blank">Google Scholar ↗</a>
        ${doi_url?`<a class="pact" href="${doi_url}" target="_blank">DOI ↗</a>`:''}
        <button class="pact" onclick='exportCite(${JSON.stringify({title:p.title,year:p.year,doi:p.doi,journal:p.journal})})'>Cite</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function renderMatrix() {
  const papers = filterPapers();
  if (!papers.length) return `<div class="empty">No papers match filters.</div>`;

  const speciesSet = new Map();
  papers.forEach(p => p.species.forEach(s => { if(!speciesSet.has(s.sci)) speciesSet.set(s.sci, s.en||s.sci); }));
  const spList = [...speciesSet.entries()].slice(0, 12);

  const functions = [...new Set(ALL_CLAIMS.filter(c=>c.type==='function').map(c=>c.value))].slice(0,12);

  // Build matrix: species × function
  const matrix = new Map();
  for (const [sci] of spList) {
    matrix.set(sci, new Map());
    for (const fn of functions) matrix.get(sci).set(fn, 0);
  }
  for (const p of papers) {
    for (const s of p.species) {
      if (matrix.has(s.sci)) {
        for (const fn of p.functions) {
          if (matrix.get(s.sci).has(fn)) {
            matrix.get(s.sci).set(fn, matrix.get(s.sci).get(fn) + 1);
          }
        }
      }
    }
  }

  let html = `<p style="font-size:12px;color:var(--muted);margin-bottom:1rem">
    Species × communicative function matrix — cell = paper count</p>
  <div class="matrix-wrap"><table class="matrix">
  <thead><tr><th>species</th>${functions.map(f=>`<th>${f}</th>`).join('')}</tr></thead>
  <tbody>`;
  for (const [sci, en] of spList) {
    html += `<tr><td><em>${sci}</em><br><small style="color:var(--hint)">${en}</small></td>`;
    for (const fn of functions) {
      const n = matrix.get(sci)?.get(fn) || 0;
      html += n > 0
        ? `<td><span class="cell-yes">✓</span><br><small style="color:var(--muted)">${n}p</small></td>`
        : `<td><span class="cell-no">—</span></td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

function renderFunctions() {
  const papers = filterPapers();
  const fnCounts = new Map();
  papers.forEach(p => {
    p.functions.forEach(f => {
      if (!fnCounts.has(f)) fnCounts.set(f, {papers:new Set(), species:new Set()});
      fnCounts.get(f).papers.add(p.paper_id || p.title);
      p.species.forEach(s => fnCounts.get(f).species.add(s.sci));
    });
    p.vocalisations.forEach(v => {
      if (!fnCounts.has('voc:'+v)) fnCounts.set('voc:'+v, {papers:new Set(), species:new Set(), isVoc:true, label:v});
      fnCounts.get('voc:'+v).papers.add(p.paper_id || p.title);
      p.species.forEach(s => fnCounts.get('voc:'+v).species.add(s.sci));
    });
  });

  const sorted = [...fnCounts.entries()].sort((a,b)=>b[1].papers.size-a[1].papers.size);
  if (!sorted.length) return `<div class="empty">No function/vocalisation data for current filters.</div>`;

  return `<div>` + sorted.map(([key, data]) => {
    const isVoc = data.isVoc;
    const label = data.label || key;
    const tagCls = isVoc ? 'ptag-v' : 'ptag-f';
    const barW = Math.round((data.papers.size / Math.max(...sorted.map(s=>s[1].papers.size))) * 100);
    return `<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
        <span class="ptag ${tagCls}" style="font-size:12px;padding:3px 10px">${label}</span>
        <span style="font-size:11px;color:var(--muted)">${data.papers.size} paper${data.papers.size!==1?'s':''} · ${data.species.size} species</span>
      </div>
      <div style="background:var(--surface);border-radius:3px;height:4px;width:100%;margin-bottom:6px">
        <div style="background:${isVoc?'var(--amber)':'var(--violet)'};height:4px;border-radius:3px;width:${barW}%"></div>
      </div>
      <div style="font-size:11px;color:var(--hint)">${[...data.species].slice(0,6).join(', ')}${data.species.size>6?` +${data.species.size-6} more`:''}</div>
    </div>`;
  }).join('') + `</div>`;
}

// ── Export helpers ────────────────────────────────────────────────────────────
function exportCite(p) {
  const bib = `@article{${(p.doi||p.title.slice(0,20)).replace(/[^a-z0-9]/gi,'_')},
  title   = {${p.title}},
  year    = {${p.year||'n.d.'}},
  journal = {${p.journal||'—'}},
  doi     = {${p.doi||''}}
}`;
  const pop = document.createElement('div');
  pop.className='epop'; pop.onclick=e=>{if(e.target===pop)pop.remove()};
  pop.innerHTML=`<div class="ebox"><h3>Citation</h3><code>${bib}</code>
    <div class="ebtns">
      <button class="eb ebp" onclick="navigator.clipboard.writeText(${JSON.stringify(bib)}).then(()=>this.textContent='Copied!')">Copy BibTeX</button>
      <button class="eb ebg" onclick="this.closest('.epop').remove()">Close</button>
    </div></div>`;
  document.body.appendChild(pop);
}

function showExportHelp() {
  const papers = filterPapers();
  const speciesSet = new Set(papers.flatMap(p=>p.species.map(s=>s.sci)));
  const fns = [...new Set(papers.flatMap(p=>p.functions))].slice(0,3);
  const sps = [...speciesSet].slice(0,2);

  let cmds = '# Run in your terminal:\n\n';
  if (sps.length) {
    cmds += `# Species review:\npython scripts/10_generate_review.py --mode species --query "${sps[0]}"\n\n`;
  }
  if (fns.length) {
    cmds += `# Function review:\npython scripts/10_generate_review.py --mode function --query "${fns[0]}"\n\n`;
  }
  if (sps.length >= 2) {
    cmds += `# Comparative review:\npython scripts/10_generate_review.py --mode compare --query "${sps[0]},${sps[1]}"\n\n`;
  }
  cmds += `# Word document:\npython scripts/10_generate_review.py --mode function --query "${fns[0]||'alarm call'}" --format docx`;

  document.getElementById('review-cmds').textContent = cmds;
  document.getElementById('epop').style.display = 'flex';
}

function copyReviewCmds() {
  const txt = document.getElementById('review-cmds').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    document.querySelector('#epop .ebp').textContent = 'Copied!';
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadData();
</script>
