<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe.Logos-Graph — Species Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--surface:#161820;--surface2:#1e2028;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#e8e9ec;--muted:#7a7e8a;--hint:#454854;--amber:#e8a427;--amber-dim:rgba(232,164,39,0.12);--teal:#2cb88a;--teal-dim:rgba(44,184,138,0.12);--violet:#9b8ef0;--violet-dim:rgba(155,142,240,0.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(14,15,17,0.7);backdrop-filter:blur(16px)}
.logo{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:0;letter-spacing:-0.02em}
.logo .a{color:var(--amber)}
.logo-sub{font-size:11px;color:var(--muted);font-weight:300;margin-left:8px;letter-spacing:0;font-family:'DM Sans',sans-serif}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.nav-links a:hover{color:var(--text)}
.nav-gh{font-size:12px;padding:5px 14px;border:1px solid var(--border2);border-radius:99px;color:var(--text);text-decoration:none}

/* search view */
#sv{max-width:1100px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1}
.hero{padding:3rem 0 2rem;display:grid;grid-template-columns:1fr auto;align-items:end;gap:1rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.hero h1{font-family:'DM Serif Display',serif;font-size:36px;font-weight:400;color:var(--text);line-height:1.15}
.hero h1 em{font-style:normal;color:var(--text)}
.hero-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.8}
.sw{position:relative;margin-bottom:.6rem}
.sw input{width:100%;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;padding:14px 20px 14px 48px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;color:var(--text);outline:none;transition:border-color .2s}
.sw input:focus{border-color:rgba(232,164,39,.5)}
.sw input::placeholder{color:var(--hint)}
.si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.fchip{font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);color:var(--hint);cursor:pointer;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.fchip:hover,.fchip.on{color:var(--amber);border-color:rgba(232,164,39,.4);background:var(--amber-dim)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.scard{background:var(--surface);cursor:pointer;overflow:hidden;transition:background .15s}
.scard:hover{background:var(--surface2)}
.sthumb{height:130px;background:var(--surface2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .2s;position:absolute;inset:0}
.scard:hover .sthumb img{opacity:1}
.sph{font-size:11px;color:var(--hint)}
.scb{padding:12px 14px}
.scn{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;text-transform:capitalize}
.scs{font-size:11px;font-style:italic;color:var(--muted);margin-bottom:6px}
.sct{display:flex;gap:4px;flex-wrap:wrap}
.stg{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.stg-has{border-color:rgba(232,164,39,.3);color:var(--amber);background:var(--amber-dim)}
.no-r{grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted);font-size:14px}
.loading{grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted);font-size:13px}

/* detail view */
#dv{display:none;max-width:900px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1}
.back{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;padding:1.5rem 0;display:flex;align-items:center;gap:6px}.back:hover{color:var(--text)}
.sph2{display:grid;grid-template-columns:110px 1fr;gap:1.5rem;align-items:start;margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.spi{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid var(--border2)}
.spph{width:110px;height:110px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;border:2px solid var(--border)}
.spt{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;color:var(--text);text-transform:capitalize;margin-bottom:4px}
.spsc{font-style:italic;font-size:14px;color:var(--muted);margin-bottom:12px}
.bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid}
.bn{color:var(--muted);border-color:var(--border);background:var(--surface2)}
.bt{color:var(--teal);border-color:rgba(44,184,138,.3);background:var(--teal-dim)}
.bv{color:var(--violet);border-color:rgba(155,142,240,.3);background:var(--violet-dim)}
.ba{color:var(--amber);border-color:rgba(232,164,39,.3);background:var(--amber-dim)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem}
.tab{font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 18px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--text)}.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.gw{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.5rem;background:var(--surface)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.ic{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.ic label{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:4px}
.ic span{font-size:13px;color:var(--text);font-weight:300}
.ic a{font-size:13px;color:var(--amber);text-decoration:none}
.wb{font-size:13px;color:var(--muted);line-height:1.75;font-weight:300;margin-bottom:6px}
.ws{font-size:11px;color:var(--hint);margin-bottom:1.5rem}
.cs{margin-bottom:1.25rem}
.cl{font-size:10px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid}
.tv{color:var(--amber);border-color:rgba(232,164,39,.35);background:var(--amber-dim)}
.tc{color:var(--teal);border-color:rgba(44,184,138,.35);background:var(--teal-dim)}
.tf{color:var(--violet);border-color:rgba(155,142,240,.35);background:var(--violet-dim)}
.tm{color:var(--muted);border-color:var(--border);background:var(--surface2)}
/* papers */
.pc{border-bottom:1px solid var(--border);padding:18px 0}.pc:last-child{border-bottom:none}
.pt{font-size:15px;font-weight:400;color:#7eb8e8;margin-bottom:5px;cursor:pointer}
.pt:hover{text-decoration:underline}
.pau{font-size:13px;color:var(--muted);margin-bottom:3px}
.pm{font-size:12px;color:var(--hint);margin-bottom:8px}
.po{font-size:12px;color:var(--hint);line-height:1.65;font-weight:300;margin-bottom:10px;font-style:italic}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pact{font-size:11px;padding:3px 10px;border:1px solid var(--border2);border-radius:4px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block}
.pact:hover{color:var(--amber);border-color:rgba(232,164,39,.4)}
.nop{padding:2rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;text-align:center;color:var(--muted);font-size:13px;font-weight:300;line-height:2}
.nop code{font-family:monospace;color:var(--amber);font-size:11px}
/* audio */
.ac{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.am{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.am strong{color:var(--amber);font-weight:500}
.sono{width:100%;border-radius:8px;margin-bottom:10px;display:block;border:1px solid var(--border)}
audio{width:100%;margin-bottom:8px;accent-color:var(--amber)}
.xcl{font-size:12px;color:var(--amber);text-decoration:none}.xcl:hover{text-decoration:underline}
.extlinks a{display:block;font-size:13px;color:var(--amber);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--border)}
.extlinks a:hover{text-decoration:underline}.extlinks a:last-child{border-bottom:none}
.noaud{text-align:center;padding:2.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:13px;font-weight:300;line-height:2}
.noaud a{color:var(--amber);text-decoration:none}
.lm{font-size:13px;color:var(--muted);padding:1rem 0}
/* export popup */
.epop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.ebox{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:1.5rem;max-width:520px;width:90%}
.ebox h3{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1rem}
.ebox pre{font-size:11px;color:var(--teal);background:var(--bg);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre-wrap;margin-bottom:1rem;font-family:monospace}
.ebtns{display:flex;gap:8px}
.eb{font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.ebp{background:var(--amber);color:#0e0f11}.ebg{background:none;border:1px solid var(--border2);color:var(--muted)}

/* Theme tags */
.theme-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.ttag{font-size:9px;padding:2px 6px;border-radius:99px}
/* Compare btn on cards */
.card-cmp{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--hint);transition:.15s;z-index:2}
.card-cmp:hover,.card-cmp.sel{background:var(--amber);border-color:var(--amber);color:var(--bg)}
/* Compare bar */
.cmp-bar{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--surface);border-top:1px solid var(--border2);padding:.6rem 1.5rem;display:flex;align-items:center;gap:10px;transform:translateY(100%);transition:.25s}
.cmp-bar.vis{transform:translateY(0)}
.cmp-bar-names{font-size:12px;color:var(--muted);flex:1}
.cmp-bar-go{font-size:12px;padding:6px 16px;border-radius:6px;border:none;background:var(--amber);color:var(--bg);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.cmp-bar-clr{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
/* Acoustic info */
.aic{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem}
.aic .ic{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.aic .ic label{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.aic .ic span{font-size:12px;color:var(--text);font-weight:300}

/* ── CLICKABLE TAGS (communication tab) ───────────────── */
.clickable-tag{cursor:pointer;position:relative;transition:.15s}
.clickable-tag:hover{filter:brightness(1.3);transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.audio-mark{margin-left:6px;font-size:10px;opacity:.7;font-family:'DM Mono',monospace}

/* ── MEDIA TAB FILTERS ───────────────────────────────── */
.linked-banner-mini{
  background:var(--amber-dim);
  border:1px solid rgba(232,164,39,0.35);
  border-radius:8px;
  padding:.6rem .9rem;
  margin-bottom:1rem;
  font-size:12px;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.linked-banner-mini strong{color:var(--amber)}
.linked-banner-mini button{
  background:none;border:none;color:var(--amber);
  cursor:pointer;font-family:'DM Sans',sans-serif;
  font-size:11px;text-decoration:underline;
}
.media-filters{
  display:flex;flex-wrap:wrap;gap:5px;
  margin-bottom:1rem;padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.mf-chip{
  font-size:11px;padding:4px 12px;border-radius:99px;
  border:1px solid var(--border);background:none;
  color:var(--muted);cursor:pointer;transition:.15s;
  font-family:'DM Sans',sans-serif;
}
.mf-chip:hover{color:var(--text);border-color:var(--border2)}
.mf-chip.on{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:500}
.mf-chip.mf-voc.on{background:var(--amber);color:var(--bg)}
.mf-chip.mf-fn.on{background:var(--violet);color:var(--bg);border-color:var(--violet)}

/* Recording card enhancements */
.ac .rec-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.5rem;flex-wrap:wrap;gap:.4rem;
}
.ac .rec-head strong{font-size:13px;color:var(--text);font-weight:500;text-transform:capitalize}
.ac .rec-id{font-size:10px;color:var(--hint);font-family:'DM Mono',monospace}
.ac .rec-tags-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.6rem}
.ac .rec-tag{
  font-size:9px;padding:2px 8px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.5px;
}
.ac .rec-tag.voc{
  background:var(--amber-dim);color:var(--amber);
  border:1px solid rgba(232,164,39,0.25);
}
.ac .rec-tag.fn{
  background:rgba(155,142,240,0.12);color:var(--violet);
  border:1px solid rgba(155,142,240,0.25);
}

</style>
</head>

<div id="sv">

async function loadIndex() {
  INDEX = EMBEDDED_DB.map(sp => ({
    species_id: sp.sci.toLowerCase().replace(/ /g,'_'),
    scientific_name: sp.sci,
    common_name_en: sp.en,
    common_names: {en:sp.en, it:sp.it||'', es:sp.es||'', fr:sp.fr||'', de:sp.de||''},
    class_: sp.class_, order_: sp.order_, family: sp.family,
    image_url: '', paper_count: sp.papers.length, vocalisations: sp.voc,
  }));
  const totalPapers = EMBEDDED_DB.reduce((n,s)=>n+s.papers.length,0);
  document.getElementById('hm').textContent = INDEX.length + ' species · ' + totalPapers + ' curated papers';
  buildSearchIndex();
  renderGrid(INDEX);
}

// ── SEARCH INDEX ──────────────────────────────────────────────────────────
const IDX = new Map();
function buildSearchIndex() {
  IDX.clear();
  INDEX.forEach(sp => {
    IDX.set(sp.scientific_name.toLowerCase(), sp);
    IDX.set(sp.common_name_en.toLowerCase(), sp);
    Object.values(sp.common_names || {}).forEach(n => { if(n) IDX.set(n.toLowerCase(), sp); });
  });
}

function search(q) {
  if (!q.trim()) return INDEX;
  const ql = q.toLowerCase().trim();
  const ex = IDX.get(ql); if (ex) return [ex];
  return INDEX.filter(sp =>
    sp.scientific_name.toLowerCase().includes(ql) ||
    sp.common_name_en.toLowerCase().includes(ql) ||
    Object.values(sp.common_names || {}).some(n => n && n.toLowerCase().includes(ql))
  );
}

// ── IMAGE CACHE ──────────────────────────────────────────────────────────
const _imgCache = {};
async function fetchWikiImg(wiki) {
  if (!wiki) return null;
  if (_imgCache[wiki] !== undefined) return _imgCache[wiki];
  try {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(wiki));
    const d = await r.json();
    _imgCache[wiki] = d.thumbnail?.source || null;
  } catch(e) { _imgCache[wiki] = null; }
  return _imgCache[wiki];
}

const _wikiCache = {};
async function fetchWikiSummary(wiki) {
  if (!wiki) return '';
  if (_wikiCache[wiki] !== undefined) return _wikiCache[wiki];
  try {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(wiki));
    const d = await r.json();
    _wikiCache[wiki] = (d.extract||'').match(/[^.!?]+[.!?]+/g)?.slice(0,3).join(' ') || '';
  } catch(e) { _wikiCache[wiki] = ''; }
  return _wikiCache[wiki];
}

// ── RENDER GRID ───────────────────────────────────────────────────────────
function renderGrid(sps) {
  const sg = document.getElementById('sg');
  const visible = activeFilter === 'all' ? sps : sps.filter(sp => sp.class_ === activeFilter);
  if (!visible.length) { sg.innerHTML = `<div class="no-r">no species found</div>`; return; }

  sg.innerHTML = visible.map(sp => `
    <div class="scard" data-id="${sp.species_id}" onclick="openSp('${sp.species_id}')">
      <div class="sthumb" id="thumb-${sp.species_id}"><div class="sph">${sp.class_||''}</div></div>
      <div class="scb">
        <div class="scn">${sp.common_name_en}</div>
        <div class="scs">${sp.scientific_name}</div>
        <div class="sct">
          <span class="stg">${sp.class_||'—'}</span>
          ${sp.paper_count ? `<span class="stg stg-has">${sp.paper_count} paper${sp.paper_count>1?'s':''}</span>` : ''}
        </div>
      </div>
    </div>`).join('');

  // Fetch images async for each card
  visible.forEach(async sp => {
    const raw = EMBEDDED_DB.find(s => s.sci.toLowerCase().replace(/ /g,'_') === sp.species_id);
    if (!raw?.wiki) return;
    const img = await fetchWikiImg(raw.wiki);
    const thumb = document.getElementById('thumb-' + sp.species_id);
    if (thumb && img) {
      thumb.innerHTML = `<img src="${img}" loading="lazy" alt="${sp.common_name_en}" style="width:100%;height:100%;object-fit:cover;display:block;opacity:.85;position:absolute;inset:0">`;
    }
  });
}

// ── FILTER CHIPS ──────────────────────────────────────────────────────────
document.getElementById('flt').addEventListener('click', e => {
  const btn = e.target.closest('.fchip'); if (!btn) return;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeFilter = btn.dataset.f;
  renderGrid(search(document.getElementById('qi').value));
});

document.getElementById('qi').addEventListener('input', e => {
  document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));
  document.querySelector('.fchip[data-f="all"]').classList.add('on');
  activeFilter = 'all';
  renderGrid(search(e.target.value));
});

// ── OPEN SPECIES ──────────────────────────────────────────────────────────
async function openSp(sid) {
  document.getElementById('sv').style.display = 'none';
  document.getElementById('dv').style.display = 'block';
  window.scrollTo(0, 0);
  document.getElementById('sph').innerHTML = `<div class="lm">loading…</div>`;
  document.getElementById('tc').innerHTML = '';
  activeMediaFilter = null;  // reset media filter on new species

  const raw = EMBEDDED_DB.find(s => s.sci.toLowerCase().replace(/ /g,'_') === sid);
  if (!raw) {
    document.getElementById('sph').innerHTML = '<div class="lm">Species not found.</div>';
    return;
  }
  // Fetch Wikipedia image + summary using shared caches
  const imgUrl = await fetchWikiImg(raw.wiki) || '';
  const wikiSummary = await fetchWikiSummary(raw.wiki) || (raw.class_ + ' · ' + raw.order_ + ' · ' + raw.family);

  currentSp = {
    species_id: sid, scientific_name: raw.sci, common_name_en: raw.en,
    common_names: {en:raw.en, it:raw.it||'', es:raw.es||'', fr:raw.fr||'', de:raw.de||''},
    taxonomy: { class_: raw.class_, order_: raw.order_, family: raw.family, genus: raw.sci.split(' ')[0] },
    conservation_status: '', inat_id: null,
    image: { url: imgUrl, source: 'Wikimedia Commons', license: '' },
    summary: wikiSummary,
    wiki_url: 'https://en.wikipedia.org/wiki/' + (raw.wiki||raw.sci.replace(/ /g,'_')),
    wiki_title: raw.wiki || raw.sci,
    vocalisations: raw.voc||[], contexts: raw.ctx||[], functions: raw.fn||[],
    open_papers: raw.papers.filter(p=>p.doi).map(p=>({doi:p.doi, url:p.url, title:p.title, year:p.year, source:'curated'})),
    audio: { provider: 'xeno_canto', xc_query: raw.xc || raw.sci, recordings: raw.recordings || [], external_links: [] },
    papers: raw.papers, paper_count: raw.papers.length,
    communication_profile: {
      vocalisations: (raw.voc||[]).map(v=>({value:v, confidence:0.85, source:'curated', evidence_count:Math.max(1,raw.papers.length)})),
      contexts: (raw.ctx||[]).map(c=>({value:c, confidence:0.8, source:'curated', evidence_count:1})),
      functions: (raw.fn||[]).map(f=>({value:f, confidence:0.85, source:'curated', evidence_count:Math.max(1,raw.papers.length)})),
      methods: [],
    },
  };

  const sp = currentSp;
  const tax = sp.taxonomy || {};

  // Habitat background
  const hbg = document.getElementById('habitat-bg');
  const hov = document.getElementById('habitat-ov');
  if (hbg && sp.image?.url) { hbg.style.backgroundImage = `url(${sp.image.url})`; hbg.style.opacity = '1'; }
  if (hov) hov.style.opacity = '1';

  const imgEl = sp.image?.url
    ? `<img class="spi" src="${sp.image.url}" alt="${sp.common_name_en}">`
    : `<div class="spph">${tax.class_||'—'}</div>`;

  document.getElementById('sph').innerHTML = `
    <div class="sph2">${imgEl}
      <div>
        <div class="spt">${sp.common_name_en}</div>
        <div class="spsc">${sp.scientific_name}</div>
        <div class="bdgs">
          <span class="bdg bn">${tax.class_||'—'}</span>
          <span class="bdg bt">${tax.order_||'—'}</span>
          <span class="bdg bv">${tax.family||'—'}</span>
          ${sp.conservation_status ? `<span class="bdg ba">${sp.conservation_status}</span>` : ''}
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab')[0].classList.add('on');
  rtab('general');
}

// ── GRAPH SVG ─────────────────────────────────────────────────────────────
function buildGraph(sp, img) {
  const W=800,H=380,cx=W/2,cy=H/2,R=148;
  const nodes=[...(sp.vocalisations||[]).map(v=>({l:v,t:'v'})),...(sp.contexts||[]).map(c=>({l:c,t:'c'})),...(sp.functions||[]).map(f=>({l:f,t:'f'}))];
  const cols={v:{f:'rgba(232,164,39,.15)',s:'rgba(232,164,39,.6)',tx:'#e8a427'},c:{f:'rgba(44,184,138,.12)',s:'rgba(44,184,138,.5)',tx:'#2cb88a'},f:{f:'rgba(155,142,240,.12)',s:'rgba(155,142,240,.5)',tx:'#9b8ef0'}};
  const total=nodes.length||1;
  const uid=sp.species_id;
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
    <defs><clipPath id="cc_${uid}"><circle cx="${cx}" cy="${cy}" r="56"/></clipPath></defs>`;
  nodes.forEach((n,i)=>{const a=((i/total)*360-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);o+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${cols[n.t].s}" stroke-width="1" opacity=".4" stroke-dasharray="3,4"/>`;});
  o+=`<circle cx="${cx}" cy="${cy}" r="60" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>`;
  if(img)o+=`<image href="${img}" x="${cx-56}" y="${cy-56}" width="112" height="112" clip-path="url(#cc_${uid})" preserveAspectRatio="xMidYMid slice"/>`;
  else{o+=`<circle cx="${cx}" cy="${cy}" r="56" fill="#1e2028"/>`;o+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#454854">${sp.taxonomy?.class_||'—'}</text>`;}
  o+=`<circle cx="${cx}" cy="${cy}" r="56" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>`;
  o+=`<text x="${cx}" y="${cy+76}" text-anchor="middle" font-family="DM Serif Display,serif" font-size="13" fill="#e8e9ec">${sp.common_name_en}</text>`;
  nodes.forEach((n,i)=>{const a=((i/total)*360-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),col=cols[n.t],lbl=n.l.length>18?n.l.slice(0,17)+'…':n.l,w=Math.min(130,Math.max(64,lbl.length*6.6+16));o+=`<rect x="${(x-w/2).toFixed(1)}" y="${(y-13).toFixed(1)}" width="${w.toFixed(1)}" height="26" rx="13" fill="${col.f}" stroke="${col.s}" stroke-width=".8"/>`;o+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9.5" fill="${col.tx}">${lbl}</text>`;});
  [{t:'v',l:'vocalisation'},{t:'c',l:'context'},{t:'f',l:'function'}].forEach((leg,i)=>{const col=cols[leg.t];o+=`<circle cx="21" cy="${H-46+i*16}" r="4" fill="${col.f}" stroke="${col.s}" stroke-width=".8"/>`;o+=`<text x="32" y="${H-42+i*16}" font-family="DM Sans,sans-serif" font-size="9" fill="#454854">${leg.l}</text>`;});
  return o+'</svg>';
}

// ── TABS ──────────────────────────────────────────────────────────────────
function stab(name, btn) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); rtab(name);
}

function rtab(name) {
  const sp = currentSp; if (!sp) return;
  const tc = document.getElementById('tc');
  const img = sp.image?.url || '';
  const tax = sp.taxonomy || {};

  if (name === 'general') {
    tc.innerHTML = `
      <div class="gw">${buildGraph(sp, img)}</div>
      <div class="igrid">
        <div class="ic"><label>class</label><span>${tax.class_||'—'}</span></div>
        <div class="ic"><label>order</label><span>${tax.order_||'—'}</span></div>
        <div class="ic"><label>family</label><span>${tax.family||'—'}</span></div>
        <div class="ic"><label>conservation</label><span>${sp.conservation_status||'—'}</span></div>
        <div class="ic" style="grid-column:span 2"><label>sources</label>
          ${sp.wiki_url?`<a href="${sp.wiki_url}" target="_blank">Wikipedia →</a>`:''}
          ${sp.inat_id?` &nbsp;·&nbsp; <a href="https://www.inaturalist.org/taxa/${sp.inat_id}" target="_blank" style="color:var(--amber)">iNaturalist →</a>`:''}
          ${sp.gbif_usage_key?` &nbsp;·&nbsp; <a href="https://www.gbif.org/species/${sp.gbif_usage_key}" target="_blank" style="color:var(--amber)">GBIF →</a>`:''}
        </div>
      </div>
      ${sp.summary?`<p class="wb">${sp.summary}</p>`:''}
      <p class="ws">Sources: GBIF · iNaturalist · Wikipedia · Zoe.Logos-Graph v1.0</p>`;

  } else if (name === 'communication') {
    const audio = sp.audio || {};
    const recs = audio.recordings || [];
    // Build sets of voc/fn that have audio
    const vocsWithAudio = new Set();
    const fnsWithAudio = new Set();
    recs.forEach(r => {
      const types = (r.type || r.name || '').toLowerCase().split(/[,;\/]+/).map(s=>s.trim()).filter(Boolean);
      types.forEach(t => vocsWithAudio.add(t));
      // Cross-map: some types double as functions (alarm call → predator warning)
      if (types.includes('alarm call') || types.includes('alarm')) fnsWithAudio.add('predator warning');
      if (types.includes('song')) fnsWithAudio.add('mate attraction');
      if (types.includes('contact call') || types.includes('contact')) fnsWithAudio.add('group cohesion');
    });

    const renderTag = (v, cls, setOfAudio) => {
      const lower = v.toLowerCase();
      const hasAudio = setOfAudio.has(lower) || [...setOfAudio].some(a => lower.includes(a) || a.includes(lower));
      if (hasAudio) {
        return `<span class="tg ${cls} clickable-tag" onclick="jumpToMedia('${v.replace(/'/g,"\\'")}')">${v}<span class="audio-mark">♪</span></span>`;
      }
      return `<span class="tg ${cls}">${v}</span>`;
    };

    tc.innerHTML = `
      <div class="gw">${buildGraph(sp, img)}</div>
      <div class="cs"><div class="cl">vocalisation types ${recs.length?'<span style="font-size:9px;color:var(--amber);text-transform:none;letter-spacing:0;margin-left:8px">click ♪ tags to hear them</span>':''}</div>
        <div class="tags">${(sp.vocalisations||[]).map(v=>renderTag(v,'tv',vocsWithAudio)).join('')||'<span class="lm">none recorded</span>'}</div>
      </div>
      <div class="cs"><div class="cl">behavioural contexts</div><div class="tags">${(sp.contexts||[]).map(c=>`<span class="tg tc">${c}</span>`).join('')}</div></div>
      <div class="cs"><div class="cl">putative functions</div>
        <div class="tags">${(sp.functions||[]).map(f=>renderTag(f,'tf',fnsWithAudio)).join('')}</div>
      </div>`;

  } else if (name === 'evidence') {
    let html = '';
    if (!sp.papers?.length) {
      html += `<div class="nop">No curated papers for <em>${sp.common_name_en}</em>.<br>Run <code>python scripts/08_fetch_pubmed.py --only "${sp.scientific_name}"</code> to add PubMed results.</div>`;
    } else {
      html += `<div style="font-size:12px;color:var(--muted);margin-bottom:1rem">${sp.papers.length} paper${sp.papers.length!==1?'s':''} · curated open-access literature 🔓</div>`;
      html += `<div class="cs"><div>` + sp.papers.map(p => {
        const gs = `https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}`;
        return `<div class="pc">
          <div class="pt" onclick="window.open('${gs}','_blank')">${p.title}</div>
          <div class="pau">${sp.common_name_en} · animal communication study</div>
          <div class="pm">${p.year||'—'} · stage: ${p.stage||'—'} · ${p.id}</div>
          ${p.outcome?`<div class="po">"${p.outcome}"</div>`:''}
          <div class="pacts">
            <a class="pact" href="${gs}" target="_blank">Google Scholar ↗</a>
            <button class="pact" onclick='showExport(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>Cite</button>
            <button class="pact" onclick='dlBib(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>BibTeX ↓</button>
            <button class="pact" onclick='dlRIS(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>RIS ↓</button>
          </div>
        </div>`;
      }).join('') + `</div></div>`;
    }
    tc.innerHTML = html;

  } else if (name === 'media') {
    tc.innerHTML = `<div class="lm">loading audio…</div>`;
    renderMedia(sp, tc);
  }
}

// ── MEDIA ─────────────────────────────────────────────────────────────────
let activeMediaFilter = null;

function jumpToMedia(value) {
  // Switch tab UI
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  const mediaTab = [...document.querySelectorAll('.tab')].find(t=>t.textContent.trim()==='media');
  if (mediaTab) mediaTab.classList.add('on');
  activeMediaFilter = value.toLowerCase();
  rtab('media');
  // Scroll to media content
  setTimeout(()=>document.getElementById('tc')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

// Cache for Xeno-Canto API responses
const _xcCache = {};

async function fetchXenoCanto(query) {
  if (_xcCache[query]) return _xcCache[query];
  try {
    const url = `https://xeno-canto.org/api/2/recordings?query=${encodeURIComponent(query)}+q:%3EC`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    if (!data.recordings || !data.recordings.length) return null;
    // Take top 10 sorted by quality+length
    const recs = data.recordings
      .filter(r => r.file && r.length)
      .slice(0, 10)
      .map(r => ({
        id: r.id,
        type: (r.type || 'call').toLowerCase(),
        loc: r.loc || '',
        cnt: r.cnt || '',
        rec: r.rec || '',
        date: r.date || '',
        duration: r.length || '',
        audio: r.file,
        sono: r['sono'] ? (r['sono']['med'] || r['sono']['small']) : '',
        url: r.url ? (r.url.startsWith('http') ? r.url : 'https:'+r.url) : `https://xeno-canto.org/${r.id}`,
        license: r.lic ? `License: ${r.lic.includes('http')?'CC':r.lic}` : '',
      }));
    _xcCache[query] = recs;
    return recs;
  } catch(e) {
    console.warn('XC fetch failed:', e);
    return null;
  }
}

async function renderMedia(sp, tc) {
  const audio = sp.audio || {};
  const img = sp.image?.url;

  // Priority 1: pre-fetched recordings embedded in the DB (from fetch_audio.py)
  if (sp._rawRecordings && sp._rawRecordings.length && (!audio.recordings || !audio.recordings.length)) {
    audio.recordings = sp._rawRecordings;
    sp.audio = audio;
  }

  // Priority 2: live API fetch (only works if XC v2 still responds — best-effort)
  if ((!audio.recordings || !audio.recordings.length) && audio.provider === 'xeno_canto' && audio.xc_query) {
    tc.innerHTML = `<div class="lm">fetching recordings from Xeno-Canto…</div>`;
    const recs = await fetchXenoCanto(audio.xc_query);
    if (recs && recs.length) {
      audio.recordings = recs;
      sp.audio = audio;
    }
  }

  let html = '';

  // Image
  if (img) {
    html += `<div class="cs"><div class="cl">image</div>
      <img src="${img}" style="max-width:100%;border-radius:10px;margin-bottom:6px;border:1px solid var(--border)" alt="${sp.common_name_en}">
      <div style="font-size:11px;color:var(--hint)">Source: ${sp.image.source||'Wikimedia Commons'} · ${sp.image.license||'see source'}</div>
    </div>`;
  }

  // Audio
  html += `<div class="cs"><div class="cl" style="margin-top:1rem">acoustic recordings</div>`;
  const provider = audio.provider || 'external_links';
  const recs = audio.recordings || [];

  if (recs.length) {
    const providerLabel = provider === 'xeno_canto' ? 'Xeno-Canto · CC licensed' :
                          provider === 'freesound'   ? 'Freesound.org' :
                          provider === 'macaulay'    ? 'Macaulay Library · Cornell' : 'curated';

    // Build vocs + functions sets
    const vocSet = new Set();
    recs.forEach(r => {
      const t = (r.type || r.name || '').toLowerCase();
      t.split(/[,;\/]+/).forEach(x => { const v=x.trim(); if(v) vocSet.add(v); });
    });
    const fnSet = new Set();
    // Map voc types → functions for filters
    if (vocSet.has('song')) fnSet.add('mate attraction');
    if ([...vocSet].some(v=>v.includes('alarm'))) fnSet.add('predator warning');
    if ([...vocSet].some(v=>v.includes('contact'))) fnSet.add('group cohesion');
    if ([...vocSet].some(v=>v.includes('distance'))) fnSet.add('group cohesion');

    // Quick-banner if jumped from communication tab
    if (activeMediaFilter) {
      html += `<div class="linked-banner-mini">
        Filtered by <strong>${activeMediaFilter}</strong>
        <button onclick="activeMediaFilter=null;rtab('media')">show all</button>
      </div>`;
    }

    html += `<p style="font-size:11px;color:var(--hint);margin-bottom:.8rem">${recs.length} recordings · ${providerLabel}</p>`;

    // Filter chips
    if (vocSet.size > 1 || fnSet.size > 0) {
      const allChip = `<button class="mf-chip ${!activeMediaFilter?'on':''}" onclick="activeMediaFilter=null;rtab('media')">all (${recs.length})</button>`;
      const vocChips = [...vocSet].map(v => {
        const count = recs.filter(r => (r.type||r.name||'').toLowerCase().includes(v)).length;
        return `<button class="mf-chip mf-voc ${activeMediaFilter===v?'on':''}" onclick="activeMediaFilter='${v}';rtab('media')">${v} <span style="opacity:.55">${count}</span></button>`;
      }).join('');
      const fnChips = [...fnSet].map(f => {
        return `<button class="mf-chip mf-fn ${activeMediaFilter===f?'on':''}" onclick="activeMediaFilter='${f}';rtab('media')">${f}</button>`;
      }).join('');

      html += `<div class="media-filters">${allChip}${vocChips}${fnChips}</div>`;
    }

    // Filter recordings
    const visible = recs.filter(r => {
      if (!activeMediaFilter) return true;
      const t = (r.type || r.name || '').toLowerCase();
      const f = activeMediaFilter.toLowerCase();
      // Match voc directly
      if (t.includes(f)) return true;
      // Match function indirectly
      if (f === 'mate attraction' && t.includes('song')) return true;
      if (f === 'predator warning' && t.includes('alarm')) return true;
      if (f === 'group cohesion' && (t.includes('contact') || t.includes('distance') || t.includes('flock'))) return true;
      return false;
    });

    if (!visible.length) {
      html += `<div class="noaud">No recordings match "${activeMediaFilter}".</div>`;
    } else {
      html += visible.map(r => {
        const isXC = provider === 'xeno_canto';
        const isFS = provider === 'freesound';
        const vocType = (r.type || r.name || 'vocalisation').toLowerCase();
        // Tags to show on card
        const tags = [];
        if (vocType.includes('song')) { tags.push({label:'song',cls:'voc'}); tags.push({label:'mate attraction',cls:'fn'}); }
        if (vocType.includes('alarm')) { tags.push({label:'alarm call',cls:'voc'}); tags.push({label:'predator warning',cls:'fn'}); }
        if (vocType.includes('contact')) { tags.push({label:'contact call',cls:'voc'}); tags.push({label:'group cohesion',cls:'fn'}); }
        if (vocType.includes('distance')) { tags.push({label:'distance call',cls:'voc'}); tags.push({label:'group cohesion',cls:'fn'}); }
        if (vocType.includes('call') && !tags.length) tags.push({label:'call',cls:'voc'});
        if (!tags.length) tags.push({label:vocType,cls:'voc'});

        return `<div class="ac">
          <div class="rec-head">
            <strong>${r.type||r.name||'vocalisation'}</strong>
            <span class="rec-id">${r.id?'XC'+r.id:''}${r.duration?' · '+r.duration+'s':''}</span>
          </div>
          <div class="rec-tags-row">
            ${tags.map(t=>`<span class="rec-tag ${t.cls}">${t.label}</span>`).join('')}
          </div>
          <div class="am">${r.cnt?r.cnt:''}${r.loc?', '+r.loc:''}${r.description?' · '+r.description:''}${r.rec?'<br>rec: '+r.rec:''}${r.author?' · '+r.author:''}${r.date?' · '+r.date:''}</div>
          ${r.sono?`<img class="sono" src="${r.sono}" alt="spectrogram" onerror="this.style.display='none'">`:''}
          ${r.audio?`<audio controls preload="none" onerror="this.style.display='none'"><source src="${r.audio}" type="audio/mpeg"></audio>`:''}
          ${r.url?`<a class="xcl" href="${r.url}" target="_blank">${isXC?'XC'+r.id+' on Xeno-Canto':isFS?'View on Freesound':'view source'} →</a>`:''}
          ${r.license?`<div style="font-size:10px;color:var(--hint);margin-top:4px">${r.license}</div>`:''}
        </div>`;
      }).join('');
    }

  } else if (audio.external_links?.length) {
    html += `<div class="extlinks">` + audio.external_links.map(l => `<a href="${l.url}" target="_blank">${l.name} →</a>`).join('') + `</div>`;
  } else {
    const sci = sp.scientific_name;
    const sciEnc = encodeURIComponent(sci);
    const sciUnd = sci.replace(/ /g,'_');
    const cls = sp.taxonomy?.class_ || '';

    // Class-aware source recommendations
    const links = [];
    // Macaulay covers everything, always first
    links.push({n:'Macaulay Library (Cornell)', u:`https://search.macaulaylibrary.org/catalog?taxa=${sciEnc}&mediaType=audio`, best:true});

    if (cls === 'Aves') {
      links.push({n:'Xeno-Canto', u:`https://xeno-canto.org/explore?query=${sciEnc}`, best:true});
    } else if (cls === 'Mammalia') {
      const order = (sp.taxonomy?.order_||'').toLowerCase();
      if (order.includes('cet') || /whale|dolphin|porpoise/i.test(sp.common_name_en||'')) {
        links.push({n:'DOSITS — marine mammal sounds', u:`https://dosits.org/galleries/audio-gallery/marine-mammals/`, best:true});
      }
      if (order.includes('chir') || /bat/i.test(sp.common_name_en||'')) {
        links.push({n:'Pacific NW Bat Call Library', u:`https://depts.washington.edu/sdwasm/`});
      }
      links.push({n:'Animal Sound Archive Berlin', u:`https://www.tierstimmenarchiv.de/webinterface/contents/treeview.php`});
    } else if (cls === 'Amphibia') {
      links.push({n:'Xeno-Canto (frogs)', u:`https://xeno-canto.org/explore?query=${sciEnc}`});
      links.push({n:'AmphibiaWeb', u:`https://amphibiaweb.org/cgi/amphib_query?where-scientific_name=${sciEnc}`});
    } else if (cls === 'Actinopterygii') {
      links.push({n:'FishBase — fish sounds', u:`https://www.fishbase.se/Topic/List.php?group=Sounds`, best:true});
      links.push({n:'DOSITS — fish sounds', u:`https://dosits.org/galleries/audio-gallery/fishes/`});
    } else if (cls === 'Insecta') {
      links.push({n:'Xeno-Canto (insects)', u:`https://xeno-canto.org/explore?query=${sciEnc}+grp:grasshoppers`});
      links.push({n:'Singing Insects of N. America', u:`https://orthsoc.org/sina/`});
    } else if (cls === 'Reptilia') {
      links.push({n:'Macaulay (limited)', u:`https://search.macaulaylibrary.org/catalog?taxa=${sciEnc}&mediaType=audio`});
    } else if (cls === 'Cephalopoda') {
      links.push({n:'(cephalopods communicate visually — no audio)', u:`https://commons.wikimedia.org/wiki/Category:${encodeURIComponent(sciUnd)}`});
    }
    // Wikimedia always as final fallback
    links.push({n:'Wikimedia Commons', u:`https://commons.wikimedia.org/wiki/Category:${encodeURIComponent(sciUnd)}`});

    html += `<div class="noaud" style="text-align:left">
      <div style="margin-bottom:.8rem">No recordings embedded for this species yet. Recommended sources for <strong>${cls||'this species'}</strong>:</div>
      <div class="extlinks">
        ${links.map(l => `<a href="${l.u}" target="_blank" ${l.best?'style="border-color:rgba(232,164,39,0.4);color:var(--amber)"':''}>${l.n} →</a>`).join('')}
      </div>
      <div style="font-size:10px;color:var(--hint);margin-top:.8rem">Tip: run <code style="font-family:'DM Mono',monospace">python fetch_audio.py</code> with a Xeno-Canto key to embed audio directly.</div>
    </div>`;
  }
  html += `</div>`;
  tc.innerHTML = html;
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function makeBib(p, sci) {
  return `@article{${p.id}_${p.year||'n.d.'},\n  title   = {${p.title}},\n  author  = {[see source]},\n  year    = {${p.year||'n.d.'}},\n  note    = {Stage: ${p.stage||'—'}. Species: ${sci}}\n}`;
}
function makeRIS(p, sci) {
  return `TY  - JOUR\nTI  - ${p.title}\nPY  - ${p.year||''}\nKW  - animal communication\nKW  - ${sci}\nN1  - Stage: ${p.stage||'—'}\nER  -`;
}
function showExport(p, sci) {
  const pop = document.createElement('div'); pop.className = 'epop'; pop.id = 'epop';
  pop.innerHTML = `<div class="ebox"><h3>${p.title.slice(0,55)}…</h3><pre>${makeBib(p,sci)}</pre><div class="ebtns"><button class="eb ebp" onclick="dlBib(${JSON.stringify(p)},${JSON.stringify(sci)})">BibTeX ↓</button><button class="eb ebp" onclick="dlRIS(${JSON.stringify(p)},${JSON.stringify(sci)})">RIS ↓</button><button class="eb ebg" onclick="document.getElementById('epop').remove()">close</button></div></div>`;
  document.body.appendChild(pop);
  pop.addEventListener('click', e => { if(e.target===pop) pop.remove(); });
}
function dlBib(p, sci) { dl(makeBib(p,sci), p.id+'.bib'); }
function dlRIS(p, sci) { dl(makeRIS(p,sci), p.id+'.ris'); }
function dl(content, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:'text/plain'}));
  a.download = filename; a.click();
}

function goBack() {
  document.getElementById('dv').style.display = 'none';
  document.getElementById('sv').style.display = 'block';
  window.scrollTo(0, 0);
  currentSp = null;
  const hbg = document.getElementById('habitat-bg');
  const hov = document.getElementById('habitat-ov');

  if (hov) hov.style.opacity = '0';
}

// ── COMPARE SYSTEM ──────────────────────────────────────
let compareSet = new Set();
try { compareSet = new Set(JSON.parse(sessionStorage.getItem('zl_compare')||'[]')); } catch(e){}
function saveCompare(){ sessionStorage.setItem('zl_compare',JSON.stringify([...compareSet])); }
function toggleCompare(sci,ev){
  if(ev)ev.stopPropagation();
  if(compareSet.has(sci)) compareSet.delete(sci); else if(compareSet.size<4) compareSet.add(sci);
  saveCompare(); updateCompareBar();
  // re-render
  document.querySelectorAll('.card-cmp').forEach(b=>{
    b.classList.toggle('sel', compareSet.has(b.dataset.sci));
  });
}
function clearCompare(){ compareSet.clear(); saveCompare(); updateCompareBar(); document.querySelectorAll('.card-cmp').forEach(b=>b.classList.remove('sel')); }
function updateCompareBar(){
  const bar=document.getElementById('cmp-bar');
  if(!bar)return;
  if(compareSet.size>0){
    bar.classList.add('vis');
    const names=[...compareSet].map(sci=>{const sp=EMBEDDED_DB.find(s=>s.sci===sci);return sp?sp.en:sci;});
    document.getElementById('cmp-bar-names').textContent=names.join(' vs ');
  } else bar.classList.remove('vis');
}
updateCompareBar();
</script>
