const THEMES = [{"id":"vocal_learning","label":"Vocal Learning","desc":"Acquisition of vocalisations through auditory experience and sensorimotor feedback","color":"#4ecdc4"},{"id":"referential","label":"Referential Communication","desc":"Signals encoding information about external objects, events, or predator type","color":"#ff6b6b"},{"id":"syntax","label":"Syntax & Combinatoriality","desc":"Rule-governed combination or sequencing of signal elements","color":"#ffd93d"},{"id":"individual_recognition","label":"Individual Recognition","desc":"Identification of conspecifics via acoustic signatures","color":"#6c5ce7"},{"id":"cultural_transmission","label":"Cultural Transmission","desc":"Social transfer of vocal traditions across generations","color":"#a29bfe"},{"id":"turn_taking","label":"Turn-taking & Duetting","desc":"Temporally coordinated exchange of signals between individuals","color":"#fd79a8"},{"id":"honest_signalling","label":"Honest Signalling","desc":"Signals reliably encoding sender quality, condition, or motivation","color":"#00b894"},{"id":"echolocation","label":"Echolocation / Biosonar","desc":"Active acoustic sensing for navigation and prey detection","color":"#0984e3"},{"id":"infrasound","label":"Infrasound Communication","desc":"Communication using frequencies below human hearing","color":"#e17055"},{"id":"dialects","label":"Vocal Dialects","desc":"Geographic or group-specific variation in vocal structure","color":"#fdcb6e"},{"id":"emotion","label":"Emotional Signalling","desc":"Acoustic encoding of arousal, valence, and affective states","color":"#e84393"},{"id":"multimodal","label":"Multimodal Communication","desc":"Integration of acoustic signals with visual, chemical, or tactile channels","color":"#00cec9"},{"id":"deception","label":"Deceptive Signalling","desc":"Production of misleading signals for competitive advantage","color":"#636e72"},{"id":"parent_offspring","label":"Parent-Offspring Communication","desc":"Acoustic exchanges between parents and young, including prenatal","color":"#fab1a0"},{"id":"alarm","label":"Alarm & Predator Response","desc":"Warning signals encoding predator type, urgency, or escape strategy","color":"#ff7675"},{"id":"cooperation","label":"Cooperative Communication","desc":"Signals coordinating group activities: foraging, hunting, territory defence","color":"#74b9ff"}];
const themeMap = Object.fromEntries(THEMES.map(t=>[t.id,t]));
let cmpSet = [];
try { cmpSet = JSON.parse(sessionStorage.getItem('zl_compare')||'[]'); } catch(e){}

function render() {
  const sps = cmpSet.map(sci=>DB.find(s=>s.sci===sci)).filter(Boolean);
  const slots = document.getElementById('cmp-slots');
  const result = document.getElementById('cmp-result');
  if(sps.length<2){
    slots.innerHTML='<p style="color:var(--muted)">Go to <a href="species_explorer.html" style="color:var(--amber)">Species</a> and select 2–4 species with the ✓ button.</p>';
    result.innerHTML='';return;
  }
  slots.innerHTML=sps.map(sp=>`<div class="cmp-slot"><em>${sp.sci}</em><small>${sp.en}</small><button class="cmp-rm" onclick="rm('${sp.sci}')">remove</button></div>`).join('');

  const rows=[
    ['Class',s=>s.class_],['Order',s=>s.order_||''],['Family',s=>s.family||''],
    ['Freq range',s=>s.freq||'—'],['Learning',s=>s.learning||'—'],['Semiotic',s=>s.semiotic||'—'],
    ['Vocalisations',s=>(s.voc||[]).join(', ')],['Contexts',s=>(s.ctx||[]).join(', ')],
    ['Functions',s=>(s.fn||[]).join(', ')],
    ['Themes',s=>(s.themes||[]).map(t=>themeMap[t]?themeMap[t].label:t).join(', ')],
    ['Papers',s=>(s.papers||[]).length],
  ];
  let h=`<table><thead><tr><th>Dimension</th>${sps.map(s=>`<th>${s.en}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(([l,fn])=>{h+=`<tr><td>${l}</td>${sps.map(s=>`<td>${fn(s)}</td>`).join('')}</tr>`;});
  h+='</tbody></table>';

  const allTh=sps.map(s=>new Set(s.themes||[]));
  const shared=[...allTh[0]].filter(t=>allTh.every(s=>s.has(t)));
  const allFn=sps.map(s=>new Set(s.fn||[]));
  const sharedFn=[...allFn[0]].filter(f=>allFn.every(s=>s.has(f)));

  h+=`<div class="overlap"><h3>Trait Overlap</h3><div class="ogrid">
    <div class="ocard"><h4>Shared Themes</h4>${shared.length?shared.map(t=>`<span class="stag">${themeMap[t]?themeMap[t].label:t}</span>`).join(''):'<span style="color:var(--muted);font-size:11px">None</span>'}</div>
    <div class="ocard"><h4>Shared Functions</h4>${sharedFn.length?sharedFn.map(f=>`<span class="stag">${f}</span>`).join(''):'<span style="color:var(--muted);font-size:11px">None</span>'}</div>
  </div></div>`;
  result.innerHTML=h;
}
function rm(sci){cmpSet=cmpSet.filter(s=>s!==sci);sessionStorage.setItem('zl_compare',JSON.stringify(cmpSet));render();}
render();
</script>
