<style>
:root{--bg:#072928;--surface:#0c332f;--surface2:#123f39;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#eaf3ef;--muted:#7fa39c;--hint:#466b64;--amber:#48a89a;--amber-dim:rgba(72,168,154,0.12);--teal:#2cb88a;--teal-dim:rgba(44,184,138,0.12);--violet:#9b8ef0;--violet-dim:rgba(155,142,240,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(7,41,40,0.85);backdrop-filter:blur(16px)}
.logo{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);text-decoration:none;letter-spacing:-0.02em}
.logo .a{color:var(--amber)}
.logo-sub{font-size:11px;color:var(--muted);font-weight:300;margin-left:8px;font-family:'DM Sans'}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.nav-links a:hover{color:var(--text)}
.nav-gh{font-size:12px;padding:5px 14px;border:1px solid var(--border2);border-radius:99px;color:var(--text);text-decoration:none}
.main{max-width:1000px;margin:0 auto;padding:2rem}
.cmp-slots{display:flex;gap:1rem;margin:1.5rem 0;flex-wrap:wrap}
.cmp-slot{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;min-width:160px;flex:1;text-align:center}
.cmp-slot em{font-size:14px;color:var(--text)}
.cmp-slot small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.cmp-rm{background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:11px;margin-top:4px;font-family:'DM Sans'}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:1rem}
th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--amber);border-bottom:1px solid var(--border);font-weight:500}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--muted);vertical-align:top}
td:first-child{color:var(--hint);font-weight:500;width:140px}
tr:hover td{background:var(--surface)}
.overlap{margin-top:2rem}
.overlap h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--amber);margin-bottom:.8rem}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ocard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem}
.ocard h4{font-size:12px;color:var(--text);margin-bottom:.5rem}
.stag{font-size:10px;padding:3px 8px;border-radius:99px;display:inline-block;margin:2px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(72,168,154,.25)}
.utag{font-size:10px;padding:3px 8px;border-radius:99px;display:inline-block;margin:2px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
@media(max-width:700px){.ogrid{grid-template-columns:1fr}.cmp-slots{flex-direction:column}}
</style>
</head>

.pcard-x:hover{color:#ff6b6b}

.pcard-sci{font-style:italic;color:var(--amber);font-size:12px;padding:6px 12px 0}
.pcard-types{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 4px}
.ptype{font-size:9.5px;padding:2px 8px;border-radius:99px;text-transform:lowercase}
.pcls{font-size:10px;color:var(--muted);padding:0 12px 6px}
.pstats{border-top:1px solid var(--border);margin-top:6px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:5px}
.pstat{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.pstat .k{color:var(--muted)}
.pstat .v{color:var(--text);text-align:right}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cmp-count{font-size:12px;color:var(--hint);margin:1rem 0 .5rem}
</style>

<div class="cmp-main">
  <h1 class="cmp-h1">Compare species</h1>
  <div class="cmp-sub">Search and add animals, compare them side by side as cards. Click a name to open its full profile.</div>
  <div class="cmp-searchwrap">

  if(!q){ drop.classList.remove('open'); drop.innerHTML=''; return; }
  const hits=DB.filter(s=>!picked.includes(s.sci) &&
      ((s.en||'').toLowerCase().includes(q) || (s.sci||'').toLowerCase().includes(q))).slice(0,10);
  if(!hits.length){ drop.innerHTML='<div class="cmp-opt" style="cursor:default;color:var(--muted)">No match</div>'; drop.classList.add('open'); return; }
  drop.innerHTML=hits.map(s=>`<div class="cmp-opt" onclick="addSp('${s.sci.replace(/'/g,"\'")}')">
      <span>${esc(s.en)} <span class="sci">${esc(s.sci)}</span></span><span class="cls">${esc(s.class_||'')}</span></div>`).join('');
  drop.classList.add('open');
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function addSp(sci){
  if(picked.length>=MAX || picked.includes(sci)) return;
  picked.push(sci);
  document.getElementById('cmpSearch').value='';
  document.getElementById('cmpDrop').classList.remove('open');
  render();
}
function removeSp(sci){ picked=picked.filter(x=>x!==sci); render(); }

function render(){
  const wrap=document.getElementById('cmpCards');
  const empty=document.getElementById('cmpEmpty');
  const count=document.getElementById('cmpCount');
  empty.style.display = picked.length? 'none':'block';
  count.textContent = picked.length? `${picked.length} of ${MAX} selected` : '';
  wrap.innerHTML = picked.map(sci=>card(byEn[sci])).join('');
  picked.forEach(sci=>loadImg(byEn[sci]));
}

function card(s){
  const lm=learnMeta(s.learning);
  const types=(s.themes||[]).map(t=>{const m=THEME[t]; if(!m) return ''; 
     return `<span class="ptype" style="background:${m.color}22;color:${m.color};border:0.5px solid ${m.color}66">${esc(m.label)}</span>`;}).join('');
  const fns=(s.fn||[]).slice(0,3).join(', ') || '—';
  const cached=imgCache[s.sci];
  const imgInner = cached ? `<img src="${cached}" alt="${esc(s.en)}">`
                 : (cached===''? `<span class="pcard-ph">${esc(s.class_||'no image')}</span>`
                              : `<span class="pcard-ph" id="ph-${cssid(s.sci)}">loading...</span>`);
  return `<div class="pcard">
    <div class="pcard-top"><div class="pcard-name" title="Open species card" style="cursor:pointer" onclick="openInExplorer('${s.sci.replace(/'/g,"\'")}')">${esc(s.en||s.sci)}</div>
      <button class="pcard-x" title="remove" onclick="removeSp('${s.sci.replace(/'/g,"\'")}')">✕</button></div>
    <div class="pcard-imgbox" id="img-${cssid(s.sci)}">${imgInner}</div>
    <div class="pcard-sci">${esc(s.sci)}</div>
    <div class="pcls">${esc(s.class_||'')}${s.family?' · '+esc(s.family):''}</div>
    <div class="pcard-types">${types||'<span class="pcls" style="padding:0">no theme</span>'}</div>
    <div class="pstats">
      <div class="pstat"><span class="k">vocal learning</span><span class="v"><span class="pdot" style="background:${lm.c}"></span>${lm.l}</span></div>
      <div class="pstat"><span class="k">frequency</span><span class="v">${esc(s.freq||'—')}</span></div>
      <div class="pstat"><span class="k">functions</span><span class="v">${esc(fns)}</span></div>
      <div class="pstat"><span class="k">semiotic</span><span class="v">${esc(s.semiotic||'—')}</span></div>
      <div class="pstat"><span class="k">papers</span><span class="v">${s.np||0}</span></div>
    </div>
  </div>`;
}
function cssid(sci){return sci.replace(/[^a-zA-Z0-9]/g,'_');}

async function loadImg(s){
  if(imgCache[s.sci]!==undefined){ return; }
  try{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(s.wiki));
    const d=await r.json();
    const u=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||'';
    imgCache[s.sci]=u;
  }catch(e){ imgCache[s.sci]=''; }
  const box=document.getElementById('img-'+cssid(s.sci));
  if(box){
    box.innerHTML = imgCache[s.sci] ? `<img src="${imgCache[s.sci]}" alt="${esc(s.en)}">`
                                    : `<span class="pcard-ph">${esc(s.class_||'no image')}</span>`;
  }
}

document.addEventListener('click', e=>{
  if(!e.target.closest('.cmp-searchwrap')) document.getElementById('cmpDrop').classList.remove('open');
});

['Orcinus orca','Taeniopygia guttata'].forEach(sci=>{ if(byEn[sci]) picked.push(sci); });
if(!picked.length && DB.length>=2){ picked=[DB[0].sci, DB[1].sci]; }
render();
</script>
</body>
</html>
