<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe.Logos-Graph — Graph Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#072928;--surface:#0c332f;--surface2:#123f39;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);--text:#eaf3ef;--muted:#7fa39c;--hint:#466b64;--amber:#48a89a;--amber-dim:rgba(72,168,154,0.12);--teal:#2cb88a;--violet:#9b8ef0;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
nav{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(7,41,40,0.9);backdrop-filter:blur(12px)}
.logo{font-family:'DM Serif Display',serif;font-size:16px;color:var(--text);text-decoration:none;letter-spacing:-0.02em}
.logo .a{color:var(--amber)}
.nav-r{display:flex;gap:10px;align-items:center}
.nav-links a{font-size:12px;color:var(--muted);text-decoration:none;margin-left:1rem}.nav-links a:hover{color:var(--text)}
.nbtn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.nbtn:hover{color:var(--amber);border-color:rgba(72,168,154,.4)}
.nbtn.active{color:var(--amber);border-color:rgba(72,168,154,.5);background:var(--amber-dim)}

.workspace{display:flex;flex:1;overflow:hidden}

/* CONTROLS */
.controls{width:240px;border-right:1px solid var(--border);padding:1rem;overflow-y:auto;flex-shrink:0;font-size:12px}
.ctrl-group{margin-bottom:1.25rem}
.ctrl-label{font-size:12px;color:var(--text);font-weight:500;font-style:normal;text-transform:none;letter-spacing:0;margin-bottom:.5rem;display:block}
.chip-row{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--border);color:var(--hint);cursor:pointer;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.chip:hover,.chip.on{color:var(--amber);border-color:rgba(72,168,154,.4);background:var(--amber-dim)}
input[type=range]{width:100%;accent-color:var(--amber);margin:.25rem 0}
.range-val{color:var(--muted);font-family:'DM Mono',monospace;font-size:11px}
.search-box{width:100%;font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none}
.search-box:focus{border-color:rgba(72,168,154,.5)}
.search-box::placeholder{color:var(--hint)}

/* COMMUNITY LEGEND */
.comm-list{display:flex;flex-direction:column;gap:5px}
.comm-item{display:flex;align-items:flex-start;gap:7px;cursor:pointer;padding:5px 7px;border-radius:6px;transition:background .15s}
.comm-item:hover{background:var(--surface2)}
.comm-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px}
.comm-name{font-size:11px;color:var(--muted);line-height:1.45}
.comm-count{font-size:10px;color:var(--hint);margin-top:1px}

/* GRAPH CANVAS */
.graph-wrap{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%}

/* NODE TOOLTIP */
.tooltip{position:absolute;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;pointer-events:none;max-width:260px;z-index:100;transition:opacity .15s}
.tt-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
.tt-sci{font-size:11px;font-style:italic;color:var(--muted);margin-bottom:8px}
.tt-row{font-size:11px;color:var(--hint);margin-bottom:2px}
.tt-row span{color:var(--muted)}
.tt-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tt-tag{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}

/* DETAIL PANEL */
.detail{position:absolute;right:0;top:0;bottom:0;width:280px;background:var(--surface);border-left:1px solid var(--border);padding:1.25rem;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;z-index:10}
.detail.open{transform:translateX(0)}
.det-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;float:right;font-family:'DM Sans',sans-serif}
.det-img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);margin-bottom:.75rem}
.det-img-ph{width:64px;height:64px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--hint);margin-bottom:.75rem}
.det-title{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;color:var(--text);text-transform:capitalize;margin-bottom:2px}
.det-sci{font-style:italic;font-size:12px;color:var(--muted);margin-bottom:.75rem}
.det-bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.75rem}
.det-bdg{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);color:var(--muted);background:var(--surface2)}
.det-section{margin-bottom:.75rem}
.det-label{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.det-tags{display:flex;flex-wrap:wrap;gap:3px}
.det-tag{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid}
.det-v{color:var(--amber);border-color:rgba(72,168,154,.35);background:var(--amber-dim)}
.det-f{color:var(--violet);border-color:rgba(155,142,240,.35);background:var(--violet-dim)}
.det-c{color:var(--teal);border-color:rgba(44,184,138,.35);background:var(--teal-dim)}
.det-btn{display:block;width:100%;font-size:12px;padding:7px;border:1px solid var(--border2);border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;margin-top:6px;text-decoration:none}
.det-btn:hover{color:var(--amber);border-color:rgba(72,168,154,.4)}

/* Stats bar */
.statsbar{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(22,24,32,0.9);border:1px solid var(--border2);border-radius:99px;padding:6px 18px;display:flex;gap:18px;font-size:11px;color:var(--muted);backdrop-filter:blur(8px)}
.statsbar span{color:var(--text)}

/* Mode toggle */
.mode-row{display:flex;gap:4px;margin-bottom:.75rem;flex-wrap:wrap}
.mode-btn{flex:1 1 30%;font-size:11px;padding:5px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--hint);cursor:pointer;font-family:'DM Sans',sans-serif}
.mode-btn.on{background:var(--amber-dim);color:var(--amber);border-color:rgba(72,168,154,.4)}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><span>Zoe<span class="a">.</span>Logos<span class="a">-</span>Graph</span></a>
  <div class="nav-r">
    <div class="nav-links">
      <a href="species_explorer.html">species</a>
      <a href="literature.html">literature</a>
      <a href="graph_explorer.html" style="color:var(--text)">graph</a>
      <a href="compare.html">compare</a>
    </div>
    <button class="nbtn" onclick="downloadSVG()">↓ SVG</button>
    <button class="nbtn" onclick="downloadJSON()">↓ JSON</button>
    <button class="nbtn" onclick="downloadGML()">↓ GraphML</button>
  </div>
</nav>

<div class="workspace">

<!-- CONTROLS -->
<aside class="controls">
  <div class="ctrl-group">
    <input class="search-box" type="text" id="search" placeholder="search species…" oninput="filterNodes(this.value)">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">group species by</span>
    <div class="mode-row">
      <button class="mode-btn on" id="grp-none" onclick="setGroupBy('none',this)">none</button>
      <button class="mode-btn" id="grp-sp" onclick="setGroupBy('species',this)">species</button>
      <button class="mode-btn" id="grp-theme" onclick="setGroupBy('theme',this)">communicative theme</button>
      <button class="mode-btn" id="grp-fn" onclick="setGroupBy('function',this)">communicative function</button>
    </div>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">node types</span>
    <div class="chip-row" id="type-chips">
      <button class="chip on" data-t="species" onclick="toggleType('species',this)">species</button>
      <button class="chip on" data-t="vocalisation" onclick="toggleType('vocalisation',this)">vocalisation</button>
      <button class="chip on" data-t="function" onclick="toggleType('function',this)">function</button>
      <button class="chip on" data-t="context" onclick="toggleType('context',this)">context</button>
    </div>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">vocal learning</span>
    <div class="chip-row" id="learn-filters"></div>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">link strength ≥ <span class="range-val" id="rv-weight">1</span></span>
    <input type="range" min="1" max="5" value="1" id="r-weight" oninput="document.getElementById('rv-weight').textContent=this.value;applyFilters()">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">node size</span>
    <input type="range" min="0.5" max="3" step="0.1" value="1" id="r-size" oninput="updateSizes(this.value)">
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">communities</span>
    <div class="comm-list" id="comm-list"></div>
  </div>
</aside>

<!-- GRAPH -->
<div class="graph-wrap" id="graph-wrap">
  <svg id="canvas">
    <defs>
      <marker id="arrow" viewBox="0 -3 8 6" refX="14" refY="0" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,-3L8,0L0,3" fill="#466b64"/>
      </marker>
    </defs>
    <g id="root"></g>
  </svg>

  <div class="tooltip" id="tooltip" style="opacity:0;left:-999px;top:-999px"></div>

  <div class="statsbar" id="statsbar">
    <span id="st-n">— nodes</span> ·
    <span id="st-e">— edges</span> ·
    <span id="st-c">— communities</span>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="detail" id="detail">
  <button class="det-close" onclick="closeDetail()">✕</button>
  <div id="det-content"></div>
</div>

</div>

<script>
const DATA_BASE = 'data/built';
let RAW_DATA = null;
let simulation = null;
let currentMode = 'bipartite';
let visibleTypes = new Set(['species','vocalisation','function','context']);
let sizeScale = 1.0;
let minWeight = 1;
let highlightComm = null;
let groupBy = 'none';

const svg    = d3.select('#canvas');
const root   = d3.select('#root');
const tooltip = document.getElementById('tooltip');
const wrap   = document.getElementById('graph-wrap');

// ── Load ──────────────────────────────────────────────────────────────────────
async function load() {
  try {
    const r = await fetch(`${DATA_BASE}/graph_communities.json`);
    if (!r.ok) throw new Error(r.status);
    RAW_DATA = await r.json();
    buildCommunityLegend();
    buildLearnFilters();
    initGraph();
  } catch(e) {
    document.getElementById('graph-wrap').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:1rem">
        <p style="color:var(--muted);font-size:14px">Graph data not found.</p>
        <code style="font-size:12px;color:var(--amber);background:var(--surface);padding:8px 14px;border-radius:8px">
          python scripts/11_community_detection.py
        </code>
        <p style="color:var(--hint);font-size:12px">then refresh this page</p>
      </div>`;
  }
}

// ── Community legend ──────────────────────────────────────────────────────────
function buildCommunityLegend() {
  const el = document.getElementById('comm-list');
  el.innerHTML = RAW_DATA.communities.map(c => `
    <div class="comm-item" onclick="highlightCommunity(${c.id})" data-cid="${c.id}">
      <div class="comm-dot" style="background:${c.color}"></div>
      <div>
        <div class="comm-name">${c.species.slice(0,3).join(', ')}${c.size>3?` +${c.size-3}`:''}</div>
        <div class="comm-count">${c.size} species · ${c.traits.slice(0,2).join(', ')}</div>
      </div>
    </div>`).join('');
}

// ── Graph init ────────────────────────────────────────────────────────────────
function getVisibleData() {
  // GROUP BY theme / function: build a hub-and-spoke graph
  if (groupBy === 'theme' || groupBy === 'function') {
    return getGroupedData(groupBy);
  }

  // GROUP BY species: species-species projection (shared traits)
  // GROUP BY none: bipartite graph
  const eid = x => (x && typeof x === 'object') ? x.id : x;
  const edges = (groupBy === 'species') ? RAW_DATA.sp_edges : RAW_DATA.edges;
  const useMode = (groupBy === 'species') ? 'species' : 'bipartite';
  const nodeIds = new Set();
  const filteredEdges = edges.filter(e => e.weight >= minWeight);
  filteredEdges.forEach(e => { nodeIds.add(eid(e.source)); nodeIds.add(eid(e.target)); });

  const nodes = RAW_DATA.nodes.filter(n => {
    if (!visibleTypes.has(n.type)) return false;
    if (n.type === 'species' && !speciesPasses(n)) return false;
    if (useMode === 'species' && n.type !== 'species') return false;
    return nodeIds.has(n.id) || (n.type === 'species');
  });
  const visNodeIds = new Set(nodes.map(n => n.id));
  const visEdges = filteredEdges.filter(e => visNodeIds.has(eid(e.source)) && visNodeIds.has(eid(e.target)));
  return { nodes, edges: visEdges };
}

// Map the corpus 'learning' field onto the vocal-learning continuum
const LEARN_META = {
  'vocal-learner': { label: 'Vocal learner', color: '#4ecdc4' },
  'limited':       { label: 'Limited learner', color: '#ffd93d' },
  'non-learner':   { label: 'Non-learner (innate)', color: '#ff6b6b' },
  'unknown':       { label: 'Unknown', color: '#7fa39c' },
};
function learnCategory(raw) {
  const v = (raw || '').toLowerCase();
  if (v === 'innate') return 'non-learner';
  if (v === 'limited') return 'limited';
  if (v.indexOf('closed-ended') >= 0 || v.indexOf('open-ended') >= 0 || v === 'social') return 'vocal-learner';
  return 'unknown';
}
let learnFilter = new Set(['vocal-learner','limited','non-learner','unknown']);
function speciesPasses(n) {
  if (n.type !== 'species') return true;
  return learnFilter.has(learnCategory(n.data?.learning));
}
function buildLearnFilters() {
  const el = document.getElementById('learn-filters');
  if (!el) return;
  const counts = { 'vocal-learner':0,'limited':0,'non-learner':0,'unknown':0 };
  RAW_DATA.nodes.forEach(n => { if (n.type==='species') counts[learnCategory(n.data?.learning)]++; });
  el.innerHTML = ['vocal-learner','limited','non-learner','unknown'].map(c => {
    const m = LEARN_META[c];
    return `<button class="chip on" data-l="${c}" onclick="toggleLearn('${c}',this)"
      style="border-color:${m.color}66;color:${m.color}">${m.label} (${counts[c]})</button>`;
  }).join('');
}
function toggleLearn(cls, btn) {
  if (learnFilter.has(cls)) { learnFilter.delete(cls); btn.classList.remove('on'); btn.style.opacity=.4; }
  else { learnFilter.add(cls); btn.classList.add('on'); btn.style.opacity=1; }
  applyFilters();
}

// Build a hub-and-spoke graph grouping species around theme / function hubs
function getGroupedData(kind) {
  const eid = x => (x && typeof x === 'object') ? x.id : x;
  const speciesNodes = RAW_DATA.nodes.filter(n => n.type === 'species' && speciesPasses(n));
  const hubs = {};   // hubId -> hub node
  const edges = [];

  speciesNodes.forEach(sp => {
    let keys = [];
    if (kind === 'theme') {
      keys = sp.data?.themes || [];
    } else { // function
      // connect species to function nodes it links to in the bipartite graph
      keys = RAW_DATA.edges
        .filter(e => (eid(e.source) === sp.id || eid(e.target) === sp.id))
        .map(e => (eid(e.source) === sp.id ? eid(e.target) : eid(e.source)))
        .filter(id => typeof id === 'string' && id.startsWith('fn:'))
        .map(id => id.slice(3));
    }
    keys.forEach(k => {
      const hubId = (kind==='theme'?'hub-theme:':'hub-fn:') + k;
      if (!hubs[hubId]) {
        let colour, label, htype;
        if (kind==='theme') { colour = THEME_COLORS[k] || '#888'; label = k.replace(/_/g,' '); htype='theme'; }
        else { colour = '#48a89a'; label = k; htype='function'; }
        hubs[hubId] = { id: hubId, label, type: htype, color: colour, size: 14, hub: true, count: 0, members: [] };
      }
      hubs[hubId].count++;
      hubs[hubId].members.push({ id: sp.id, label: sp.label, sci: sp.data?.scientific_name || '' });
      edges.push({ source: sp.id, target: hubId, weight: 1 });
    });
  });

  // Hub size scales with how many species attach
  Object.values(hubs).forEach(h => { h.size = Math.max(12, Math.min(34, 10 + h.count * 0.8)); });

  // For function grouping, drop hubs with only 1 species (too cluttered otherwise)
  let keptHubs = Object.values(hubs);
  if (kind === 'function') {
    const keepIds = new Set(keptHubs.filter(h => h.count >= 2).map(h => h.id));
    keptHubs = keptHubs.filter(h => keepIds.has(h.id));
    for (let i = edges.length - 1; i >= 0; i--) {
      if (!keepIds.has(edges[i].target)) edges.splice(i, 1);
    }
  }

  const hubNodes = keptHubs;
  const connectedSpecies = new Set(edges.map(e => e.source));
  const visSpecies = speciesNodes.filter(sp => connectedSpecies.has(sp.id));

  return { nodes: [...visSpecies, ...hubNodes], edges };
}

function setGroupBy(mode, btn) {
  groupBy = mode;
  document.querySelectorAll('#grp-none,#grp-theme,#grp-fn,#grp-sp').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if (mode === 'species') {
    // species-species projection: use the original 'species' graph mode
    currentMode = 'species';
  } else if (mode === 'none') {
    currentMode = 'bipartite';
  }
  applyFilters();
}

function initGraph() {
  const { width, height } = wrap.getBoundingClientRect();
  svg.attr('viewBox', `0 0 ${width} ${height}`);

  const { nodes, edges } = getVisibleData();
  draw(nodes, edges, width, height);

  const s = RAW_DATA.stats;
  document.getElementById('st-n').textContent = `${s.n_species} species`;
  document.getElementById('st-e').textContent = `${s.n_edges} links`;
  document.getElementById('st-c').textContent = `${s.n_communities} communities`;
}

function draw(nodes, edges, W, H) {
  if (simulation) simulation.stop();
  root.selectAll('*').remove();
  // clone so D3's in-place mutation of source/target never corrupts RAW_DATA
  nodes = nodes.map(n => ({...n}));
  edges = edges.map(e => ({...e}));

  // Zoom
  const zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom);

  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d=>d.id).distance(d => {
      const baseD = d.source?.type === 'species' && d.target?.type === 'species' ? 120 : 60;
      return baseD / Math.max(0.5, Math.log1p(d.weight || 1) * 0.5);
    }).strength(0.4))
    .force('charge', d3.forceManyBody().strength(d => d.type==='species' ? -180 : -80))
    .force('center', d3.forceCenter(W/2, H/2).strength(0.05))
    .force('collision', d3.forceCollide(d => d.size * sizeScale + 4));

  // Links
  const link = root.append('g').attr('class','links')
    .selectAll('line').data(edges).join('line')
    .attr('stroke', d => {
      const sn = nodes.find(n=>n.id===d.source?.id||n.id===d.source);
      return sn?.color || '#466b64';
    })
    .attr('stroke-opacity', 0.25)
    .attr('stroke-width', d => Math.max(0.5, Math.log1p(d.weight||1)));

  // Nodes
  const nodeG = root.append('g').attr('class','nodes')
    .selectAll('g').data(nodes).join('g')
    .attr('class','node')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click', (e,d) => { e.stopPropagation(); openDetail(d); })
    .on('mouseover', (e,d) => showTooltip(e,d))
    .on('mouseout', () => hideTooltip());

  // Species nodes: circle with possible image
  nodeG.each(function(d) {
    const g = d3.select(this);
    const r = (d.size || 8) * sizeScale;
    if (d.type === 'species') {
      g.append('circle').attr('r', r).attr('fill', speciesColour(d)).attr('fill-opacity', 0.85)
       .attr('stroke', '#fff').attr('stroke-opacity', 0.15).attr('stroke-width', 1);
      g.append('text').text(d.label.split(' ')[0])
       .attr('text-anchor','middle').attr('dy','0.35em')
       .attr('font-size', Math.max(7, r * 0.55))
       .attr('fill','rgba(255,255,255,0.85)').attr('pointer-events','none');
    } else if (d.hub) {
      // Group-by hub (theme / function): filled circle with readable white label
      const rr = (d.size || 14) * sizeScale;
      g.append('circle').attr('r', rr).attr('fill', d.color).attr('fill-opacity', 0.9)
       .attr('stroke', '#fff').attr('stroke-opacity', 0.25).attr('stroke-width', 1.5);
      g.append('text').text(d.label.length > 18 ? d.label.slice(0,17)+'…' : d.label)
       .attr('text-anchor','middle').attr('dy','0.35em')
       .attr('font-size', Math.max(8, rr*0.32)).attr('font-weight','600')
       .attr('fill','#072928').attr('pointer-events','none');
    } else {
      const rr = (d.size || 6) * sizeScale;
      g.append('circle').attr('r', rr).attr('fill', d.color).attr('fill-opacity', 0.7)
       .attr('stroke', d.color).attr('stroke-opacity', 0.5).attr('stroke-width', 0.8)
       .attr('stroke-dasharray', d.type === 'context' ? '3,2' : 'none');
      g.append('text').text(d.label.length > 14 ? d.label.slice(0,13)+'…' : d.label)
       .attr('text-anchor','middle').attr('dy','0.35em')
       .attr('font-size', 8).attr('fill', d.color).attr('pointer-events','none');
    }
  });

  svg.on('click', () => closeDetail());

  simulation.on('tick', () => {
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeG.attr('transform', d=>`translate(${d.x},${d.y})`);
  });
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function openDetail(d) {
  const panel = document.getElementById('detail');
  const content = document.getElementById('det-content');

  if (d.type === 'species') {
    const dd = d.data || {};
    const comm = RAW_DATA.communities.find(c => c.id === d.community);
    const imgEl = dd.image_url
      ? `<img class="det-img" src="${dd.image_url}" alt="${d.label}">`
      : `<div class="det-img-ph">${dd.class_||'—'}</div>`;

    // Find connected claim nodes
    const edges = RAW_DATA.edges.filter(e =>
      (e.source === d.id || e.target === d.id) ||
      (e.source?.id === d.id || e.target?.id === d.id)
    );
    const connectedIds = edges.map(e =>
      (e.source === d.id || e.source?.id === d.id) ? (e.target?.id||e.target) : (e.source?.id||e.source)
    );
    const connected = RAW_DATA.nodes.filter(n => connectedIds.includes(n.id) && n.type !== 'species');
    const byType = {};
    connected.forEach(n => { byType[n.type] = byType[n.type] || []; byType[n.type].push(n.label); });

    content.innerHTML = `
      ${imgEl}
      <div class="det-title">${d.label}</div>
      <div class="det-sci">${dd.scientific_name || ''}</div>
      <div class="det-bdgs">
        <span class="det-bdg">${dd.class_||'—'}</span>
        <span class="det-bdg">${dd.order_||'—'}</span>
        <span class="det-bdg">${dd.family||'—'}</span>
        ${dd.conservation?`<span class="det-bdg">${dd.conservation}</span>`:''}
      </div>
      ${comm?`<div style="display:flex;align-items:center;gap:5px;margin-bottom:.75rem">
        <div style="width:8px;height:8px;border-radius:50%;background:${comm.color}"></div>
        <span style="font-size:11px;color:var(--muted)">Community ${comm.id}</span>
      </div>`:''}
      ${dd.paper_count?`<div style="font-size:11px;color:var(--hint);margin-bottom:.75rem">${dd.paper_count} paper${dd.paper_count!==1?'s':''} in DB</div>`:''}
      ${byType.vocalisation?.length?`<div class="det-section"><span class="det-label">vocalisations</span><div class="det-tags">${byType.vocalisation.map(v=>`<span class="det-tag det-v">${v}</span>`).join('')}</div></div>`:''}
      ${byType.function?.length?`<div class="det-section"><span class="det-label">functions</span><div class="det-tags">${byType.function.map(f=>`<span class="det-tag det-f">${f}</span>`).join('')}</div></div>`:''}
      ${byType.context?.length?`<div class="det-section"><span class="det-label">contexts</span><div class="det-tags">${byType.context.map(c=>`<span class="det-tag det-c">${c}</span>`).join('')}</div></div>`:''}
      <a class="det-btn" href="species_explorer.html" onclick="sessionStorage.setItem('open_species','${(dd.scientific_name||d.id.replace('sp:','')).toLowerCase().replace(/ /g,'_')}')">open species profile →</a>`;
  } else if (d.hub) {
    // Hub node (theme / function / vocal-learning): members were attached at build time
    const members = (d.members || []).slice().sort((a,b)=> (a.label||'').localeCompare(b.label||''));
    const kindLabel = d.type === 'theme' ? 'communicative theme'
                    : d.type === 'function' ? 'communicative function'
                    : d.type === 'learning' ? 'vocal-learning class' : d.type;
    content.innerHTML = `
      <div class="det-title">${d.label}</div>
      <div class="det-sci">${kindLabel}</div>
      <div class="det-section" style="margin-top:1rem">
        <span class="det-label">${members.length} species in this group</span>
        <div style="margin-top:6px">${members.map(s=>`<div style="font-size:12px;color:var(--muted);padding:3px 0">${s.label}${s.sci?` <span style="color:var(--hint);font-style:italic">· ${s.sci}</span>`:''}</div>`).join('')}</div>
      </div>`;
  } else {
    // Claim node (vocalisation / function / context in the bipartite view)
    const connEdges = RAW_DATA.edges.filter(e =>
      (e.source === d.id || e.target === d.id) || (e.source?.id === d.id || e.target?.id === d.id)
    );
    const spIds = connEdges.map(e =>
      (e.source === d.id || e.source?.id === d.id) ? (e.target?.id||e.target) : (e.source?.id||e.source)
    );
    const spNodes = RAW_DATA.nodes.filter(n => spIds.includes(n.id) && n.type === 'species');
    content.innerHTML = `
      <div class="det-title">${d.label}</div>
      <div class="det-sci">${d.type}</div>
      <div class="det-section" style="margin-top:1rem">
        <span class="det-label">${spNodes.length} species with this ${d.type}</span>
        <div style="margin-top:6px">${spNodes.map(s=>`<div style="font-size:12px;color:var(--muted);padding:3px 0">${s.label}</div>`).join('')}</div>
      </div>`;
  }

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function showTooltip(e, d) {
  tooltip.style.opacity = '1';
  const dd = d.data || {};
  tooltip.innerHTML = d.type === 'species'
    ? `<div class="tt-title">${d.label}</div>
       <div class="tt-sci">${dd.scientific_name||''}</div>
       <div class="tt-row">class: <span>${dd.class_||'—'}</span></div>
       <div class="tt-row">papers: <span>${dd.paper_count||0}</span></div>
       <div class="tt-row">community: <span>${d.community}</span></div>`
    : `<div class="tt-title">${d.label}</div>
       <div class="tt-sci">${d.type}</div>`;
  posTooltip(e);
}
function hideTooltip() { tooltip.style.opacity = '0'; }
function posTooltip(e) {
  const { clientX: x, clientY: y } = e;
  const tw = 220, th = 100;
  const { innerWidth: W, innerHeight: H } = window;
  tooltip.style.left = (x + tw + 16 > W ? x - tw - 8 : x + 12) + 'px';
  tooltip.style.top  = (y + th + 8 > H ? y - th : y) + 'px';
}

// ── Filters ───────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  applyFilters();
}

function toggleType(type, btn) {
  if (visibleTypes.has(type)) { visibleTypes.delete(type); btn.classList.remove('on'); }
  else { visibleTypes.add(type); btn.classList.add('on'); }
  applyFilters();
}

function applyFilters() {
  minWeight = parseInt(document.getElementById('r-weight').value);
  const { width, height } = wrap.getBoundingClientRect();
  const { nodes, edges } = getVisibleData();
  draw(nodes, edges, width, height);
}

function filterNodes(q) {
  if (!q) { root.selectAll('.node').attr('opacity', 1); return; }
  const ql = q.toLowerCase();
  root.selectAll('.node').attr('opacity', d =>
    d.label.toLowerCase().includes(ql) || (d.data?.scientific_name||'').toLowerCase().includes(ql) ? 1 : 0.12
  );
}

function updateSizes(val) {
  sizeScale = parseFloat(val);
  root.selectAll('.node circle').attr('r', function(d) {
    return (d.size || 8) * sizeScale;
  });
}

function highlightCommunity(cid) {
  highlightComm = highlightComm === cid ? null : cid;
  document.querySelectorAll('.comm-item').forEach(el =>
    el.style.opacity = highlightComm === null || parseInt(el.dataset.cid) === highlightComm ? 1 : 0.4
  );
  root.selectAll('.node').attr('opacity', d =>
    highlightComm === null || d.community === highlightComm ? 1 : 0.08
  );
  root.selectAll('.links line').attr('stroke-opacity', d => {
    const sComm = d.source?.community, tComm = d.target?.community;
    return highlightComm === null || sComm === highlightComm || tComm === highlightComm ? 0.3 : 0.03;
  });
}

// ── Node colours ──────────────────────────────────────────────────────────────
const THEME_COLORS = {vocal_learning:'#4ecdc4',referential:'#ff6b6b',syntax:'#ffd93d',individual_recognition:'#6c5ce7',cultural_transmission:'#a29bfe',turn_taking:'#fd79a8',honest_signalling:'#00b894',echolocation:'#0984e3',infrasound:'#e17055',dialects:'#fdcb6e',emotion:'#e84393',multimodal:'#00cec9',deception:'#636e72',parent_offspring:'#fab1a0',alarm:'#ff7675',cooperation:'#74b9ff'};

function speciesColour(d) {
  // species coloured by their community (the original colour assigned in the data)
  return d.color;
}


function downloadSVG() {
  const svg_el = document.getElementById('canvas');
  const clone  = svg_el.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.style.background = '#072928';
  const blob = new Blob([clone.outerHTML], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zoe_logos_graph.svg';
  a.click();
}

function downloadJSON() {
  const a = document.createElement('a');
  a.href = `${DATA_BASE}/graph_communities.json`;
  a.download = 'zoe_logos_graph_communities.json';
  a.click();
}

function downloadGML() {
  const a = document.createElement('a');
  a.href = `${DATA_BASE}/graph_bipartite.graphml`;
  a.download = 'zoe_logos_graph_bipartite.graphml';
  a.click();
}

load();
window.addEventListener('resize', () => {
  if (!RAW_DATA) return;
  const { width, height } = wrap.getBoundingClientRect();
  svg.attr('viewBox', `0 0 ${width} ${height}`);
});
