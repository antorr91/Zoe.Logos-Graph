[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zoe-logos-graph"
version = "0.1.0"
description = "LLM-based knowledge graph for animal communication literature"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["animal communication", "knowledge graph", "bioacoustics", "NLP", "LLM"]

dependencies = [
    "anthropic>=0.25.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "pyvis>=0.3.2",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
