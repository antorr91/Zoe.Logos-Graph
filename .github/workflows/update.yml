name: Update papers

# On the 1st and 15th of every month: new papers, full abstracts, species
# attribution, recordings, then the pages are rebuilt and published.
# Start it by hand from Actions > Update papers > Run workflow.
# If something looks wrong (a service down, many papers lost) nothing is
# published and GitHub sends you an e-mail about the failed run.

on:
  schedule:
    - cron: '23 4 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt

      - name: Update
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          XC_API_KEY: ${{ secrets.XC_API_KEY }}
        run: python update_atlas.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs index.html data reports
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update papers and recordings ($(date -u +%Y-%m-%d))"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
