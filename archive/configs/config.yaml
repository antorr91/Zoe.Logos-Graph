# Zoe.Logos-Graph — configuration
# --------------------------------
# Edit this file to customise paths, model settings, and pipeline behaviour.

# ── Paths ────────────────────────────────────────────────────────────────────

paths:
  raw:          data/raw/
  annotations:  data/annotations/
  processed:    data/processed/
  graph:        data/graph/
  outputs:      outputs/

# ── LLM extraction ───────────────────────────────────────────────────────────

extraction:
  model:      claude-sonnet-4-20250514
  max_tokens: 1000
  retries:    2            # number of retry attempts per record on failure
  delay:      0.5          # seconds between API calls (rate limiting)

# ── Validation ───────────────────────────────────────────────────────────────

validation:
  strict: false            # if true, stop on first validation error

# ── Graph export ─────────────────────────────────────────────────────────────

graph:
  export_graphml: true
  export_json:    true
  output_file:    outputs/zoe_logos_graph.graphml

# ── Normalisation ─────────────────────────────────────────────────────────────

normalisation:
  apply_species_map:     true
  apply_vocalisation_map: true
  apply_context_map:     true
