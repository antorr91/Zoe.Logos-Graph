<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe.Logos-Graph — Species Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--surface:#161820;--surface2:#1e2028;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#e8e9ec;--muted:#7a7e8a;--hint:#454854;--amber:#e8a427;--amber-dim:rgba(232,164,39,0.12);--teal:#2cb88a;--teal-dim:rgba(44,184,138,0.12);--violet:#9b8ef0;--violet-dim:rgba(155,142,240,0.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(14,15,17,0.7);backdrop-filter:blur(16px)}
.logo{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:0;letter-spacing:-0.02em}
.logo .a{color:var(--amber)}
.logo-sub{font-size:11px;color:var(--muted);font-weight:300;margin-left:8px;letter-spacing:0;font-family:'DM Sans',sans-serif}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none}.nav-links a:hover{color:var(--text)}
.nav-gh{font-size:12px;padding:5px 14px;border:1px solid var(--border2);border-radius:99px;color:var(--text);text-decoration:none}

/* search view */
#sv{max-width:1100px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1}
.hero{padding:3rem 0 2rem;display:grid;grid-template-columns:1fr auto;align-items:end;gap:1rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.hero h1{font-family:'DM Serif Display',serif;font-size:36px;font-weight:400;color:var(--text);line-height:1.15}
.hero h1 em{font-style:italic;color:var(--amber)}
.hero-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.8}
.sw{position:relative;margin-bottom:.6rem}
.sw input{width:100%;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;padding:14px 20px 14px 48px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;color:var(--text);outline:none;transition:border-color .2s}
.sw input:focus{border-color:rgba(232,164,39,.5)}
.sw input::placeholder{color:var(--hint)}
.si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.fchip{font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);color:var(--hint);cursor:pointer;background:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.fchip:hover,.fchip.on{color:var(--amber);border-color:rgba(232,164,39,.4);background:var(--amber-dim)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.scard{background:var(--surface);cursor:pointer;overflow:hidden;transition:background .15s}
.scard:hover{background:var(--surface2)}
.sthumb{height:130px;background:var(--surface2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .2s;position:absolute;inset:0}
.scard:hover .sthumb img{opacity:1}
.sph{font-size:11px;color:var(--hint)}
.scb{padding:12px 14px}
.scn{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;text-transform:capitalize}
.scs{font-size:11px;font-style:italic;color:var(--muted);margin-bottom:6px}
.sct{display:flex;gap:4px;flex-wrap:wrap}
.stg{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.stg-has{border-color:rgba(232,164,39,.3);color:var(--amber);background:var(--amber-dim)}
.no-r{grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted);font-size:14px}
.loading{grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted);font-size:13px}

/* detail view */
#dv{display:none;max-width:900px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1}
.back{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;padding:1.5rem 0;display:flex;align-items:center;gap:6px}.back:hover{color:var(--text)}
.sph2{display:grid;grid-template-columns:110px 1fr;gap:1.5rem;align-items:start;margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.spi{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid var(--border2)}
.spph{width:110px;height:110px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;border:2px solid var(--border)}
.spt{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;color:var(--text);text-transform:capitalize;margin-bottom:4px}
.spsc{font-style:italic;font-size:14px;color:var(--muted);margin-bottom:12px}
.bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid}
.bn{color:var(--muted);border-color:var(--border);background:var(--surface2)}
.bt{color:var(--teal);border-color:rgba(44,184,138,.3);background:var(--teal-dim)}
.bv{color:var(--violet);border-color:rgba(155,142,240,.3);background:var(--violet-dim)}
.ba{color:var(--amber);border-color:rgba(232,164,39,.3);background:var(--amber-dim)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem}
.tab{font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 18px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--text)}.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.gw{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.5rem;background:var(--surface)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.ic{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.ic label{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:4px}
.ic span{font-size:13px;color:var(--text);font-weight:300}
.ic a{font-size:13px;color:var(--amber);text-decoration:none}
.wb{font-size:13px;color:var(--muted);line-height:1.75;font-weight:300;margin-bottom:6px}
.ws{font-size:11px;color:var(--hint);margin-bottom:1.5rem}
.cs{margin-bottom:1.25rem}
.cl{font-size:10px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid}
.tv{color:var(--amber);border-color:rgba(232,164,39,.35);background:var(--amber-dim)}
.tc{color:var(--teal);border-color:rgba(44,184,138,.35);background:var(--teal-dim)}
.tf{color:var(--violet);border-color:rgba(155,142,240,.35);background:var(--violet-dim)}
.tm{color:var(--muted);border-color:var(--border);background:var(--surface2)}
/* papers */
.pc{border-bottom:1px solid var(--border);padding:18px 0}.pc:last-child{border-bottom:none}
.pt{font-size:15px;font-weight:400;color:#7eb8e8;margin-bottom:5px;cursor:pointer}
.pt:hover{text-decoration:underline}
.pau{font-size:13px;color:var(--muted);margin-bottom:3px}
.pm{font-size:12px;color:var(--hint);margin-bottom:8px}
.po{font-size:12px;color:var(--hint);line-height:1.65;font-weight:300;margin-bottom:10px;font-style:italic}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pact{font-size:11px;padding:3px 10px;border:1px solid var(--border2);border-radius:4px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block}
.pact:hover{color:var(--amber);border-color:rgba(232,164,39,.4)}
.nop{padding:2rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;text-align:center;color:var(--muted);font-size:13px;font-weight:300;line-height:2}
.nop code{font-family:monospace;color:var(--amber);font-size:11px}
/* audio */
.ac{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.am{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.am strong{color:var(--amber);font-weight:500}
.sono{width:100%;border-radius:8px;margin-bottom:10px;display:block;border:1px solid var(--border)}
audio{width:100%;margin-bottom:8px;accent-color:var(--amber)}
.xcl{font-size:12px;color:var(--amber);text-decoration:none}.xcl:hover{text-decoration:underline}
.extlinks a{display:block;font-size:13px;color:var(--amber);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--border)}
.extlinks a:hover{text-decoration:underline}.extlinks a:last-child{border-bottom:none}
.noaud{text-align:center;padding:2.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:13px;font-weight:300;line-height:2}
.noaud a{color:var(--amber);text-decoration:none}
.lm{font-size:13px;color:var(--muted);padding:1rem 0}
/* export popup */
.epop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.ebox{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:1.5rem;max-width:520px;width:90%}
.ebox h3{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1rem}
.ebox pre{font-size:11px;color:var(--teal);background:var(--bg);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre-wrap;margin-bottom:1rem;font-family:monospace}
.ebtns{display:flex;gap:8px}
.eb{font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.ebp{background:var(--amber);color:#0e0f11}.ebg{background:none;border:1px solid var(--border2);color:var(--muted)}
</style>
</head>
<body>

<div id="habitat-bg" style="position:fixed;inset:0;z-index:-2;pointer-events:none;background-size:cover;background-position:center;filter:blur(56px) saturate(1.6);transform:scale(1.12);opacity:0;transition:opacity 1.2s ease;"></div>
<div id="habitat-ov" style="position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(14,15,17,0.82);opacity:0;transition:opacity 1.2s ease;"></div>

<nav>
  <a class="logo" href="index.html">
    <span>Zoe<span class="a">.</span>Logos<span class="a">-</span>Graph</span>
    <span class="logo-sub">v0.1.2</span>
  </a>
  <div class="nav-links">
    <a href="index.html">home</a>
    <a class="nav-gh" href="https://github.com/antorr91/Zoe.Logos-Graph" target="_blank">github →</a>
  </div>
</nav>

<div id="sv">
  <div class="hero">
    <h1>Species <em>communication</em><br>profiles</h1>
    <div class="hero-meta" id="hm">loading…</div>
  </div>
  <div class="sw"><span class="si">⌕</span>
    <input type="text" id="qi" placeholder="zebra finch · diamante mandarino · megattera · Mus musculus …" autocomplete="off">
  </div>
  <div class="filters" id="flt">
    <button class="fchip on" data-f="all">all</button>
    <button class="fchip" data-f="Aves">birds</button>
    <button class="fchip" data-f="Mammalia">mammals</button>
    <button class="fchip" data-f="Amphibia">amphibians</button>
    <button class="fchip" data-f="Insecta">insects</button>
    <button class="fchip" data-f="Actinopterygii">fish</button>
  </div>
  <div class="sgrid" id="sg"><div class="loading">loading species index…</div></div>
</div>

<div id="dv">
  <button class="back" onclick="goBack()">← all species</button>
  <div id="sph"></div>
  <div class="tabs">
    <button class="tab on" onclick="stab('general',this)">general</button>
    <button class="tab" onclick="stab('communication',this)">communication</button>
    <button class="tab" onclick="stab('evidence',this)">evidence</button>
    <button class="tab" onclick="stab('media',this)">media</button>
  </div>
  <div id="tc"></div>
</div>

<script>
// All data comes from JSON files — no species hardcoded here.
// Paths are relative so this works both locally and via GitHub Pages.
const DATA_BASE = '../data/built';

let INDEX = [];         // loaded from species_index.json
let activeFilter = 'all';
let currentSp = null;  // full species detail record

// ── LOAD INDEX ────────────────────────────────────────────────────────────
async function loadIndex() {
  try {
    const r = await fetch(`${DATA_BASE}/species_index.json`);
    if (!r.ok) throw new Error(r.status);
    INDEX = await r.json();
    document.getElementById('hm').textContent = `${INDEX.length} species · pilot v0.1.2`;
    buildSearchIndex();
    renderGrid(INDEX);
  } catch (e) {
    document.getElementById('sg').innerHTML = `<div class="no-r">Could not load species index.<br>Run <code>python build_all.py</code> first to generate <code>data/built/species_index.json</code>.</div>`;
    document.getElementById('hm').textContent = 'index not built';
  }
}

// ── SEARCH INDEX ──────────────────────────────────────────────────────────
const IDX = new Map();
function buildSearchIndex() {
  IDX.clear();
  INDEX.forEach(sp => {
    IDX.set(sp.scientific_name.toLowerCase(), sp);
    IDX.set(sp.common_name_en.toLowerCase(), sp);
    Object.values(sp.common_names || {}).forEach(n => { if(n) IDX.set(n.toLowerCase(), sp); });
  });
}

function search(q) {
  if (!q.trim()) return INDEX;
  const ql = q.toLowerCase().trim();
  const ex = IDX.get(ql); if (ex) return [ex];
  return INDEX.filter(sp =>
    sp.scientific_name.toLowerCase().includes(ql) ||
    sp.common_name_en.toLowerCase().includes(ql) ||
    Object.values(sp.common_names || {}).some(n => n && n.toLowerCase().includes(ql))
  );
}

// ── RENDER GRID ───────────────────────────────────────────────────────────
function renderGrid(sps) {
  const sg = document.getElementById('sg');
  const visible = activeFilter === 'all' ? sps : sps.filter(sp => sp.class_ === activeFilter);
  if (!visible.length) { sg.innerHTML = `<div class="no-r">no species found</div>`; return; }

  sg.innerHTML = visible.map(sp => `
    <div class="scard" data-id="${sp.species_id}" onclick="openSp('${sp.species_id}')">
      <div class="sthumb">${sp.image_url ? `<img src="${sp.image_url}" loading="lazy" alt="${sp.common_name_en}">` : ''}<div class="sph">${sp.class_||''}</div></div>
      <div class="scb">
        <div class="scn">${sp.common_name_en}</div>
        <div class="scs">${sp.scientific_name}</div>
        <div class="sct">
          <span class="stg">${sp.class_||'—'}</span>
          ${sp.paper_count ? `<span class="stg stg-has">${sp.paper_count} paper${sp.paper_count>1?'s':''}</span>` : `<span class="stg">${sp.paper_count} papers</span>`}
          ${sp.conservation ? `<span class="stg">${sp.conservation}</span>` : ''}
        </div>
      </div>
    </div>`).join('');
}

// ── FILTER CHIPS ──────────────────────────────────────────────────────────
document.getElementById('flt').addEventListener('click', e => {
  const btn = e.target.closest('.fchip'); if (!btn) return;
  document.querySelectorAll('.fchip').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  activeFilter = btn.dataset.f;
  renderGrid(search(document.getElementById('qi').value));
});

document.getElementById('qi').addEventListener('input', e => {
  document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));
  document.querySelector('.fchip[data-f="all"]').classList.add('on');
  activeFilter = 'all';
  renderGrid(search(e.target.value));
});

// ── OPEN SPECIES ──────────────────────────────────────────────────────────
async function openSp(sid) {
  document.getElementById('sv').style.display = 'none';
  document.getElementById('dv').style.display = 'block';
  window.scrollTo(0, 0);
  document.getElementById('sph').innerHTML = `<div class="lm">loading…</div>`;
  document.getElementById('tc').innerHTML = '';

  try {
    const r = await fetch(`${DATA_BASE}/species/${sid}.json`);
    if (!r.ok) throw new Error(r.status);
    currentSp = await r.json();
  } catch (e) {
    document.getElementById('sph').innerHTML = `<div class="lm">Could not load species detail. Run build pipeline first.</div>`;
    return;
  }

  const sp = currentSp;
  const tax = sp.taxonomy || {};

  // Habitat background
  const hbg = document.getElementById('habitat-bg');
  const hov = document.getElementById('habitat-ov');
  if (hbg && sp.image?.url) { hbg.style.backgroundImage = `url(${sp.image.url})`; hbg.style.opacity = '1'; }
  if (hov) hov.style.opacity = '1';

  const imgEl = sp.image?.url
    ? `<img class="spi" src="${sp.image.url}" alt="${sp.common_name_en}">`
    : `<div class="spph">${tax.class_||'—'}</div>`;

  document.getElementById('sph').innerHTML = `
    <div class="sph2">${imgEl}
      <div>
        <div class="spt">${sp.common_name_en}</div>
        <div class="spsc">${sp.scientific_name}</div>
        <div class="bdgs">
          <span class="bdg bn">${tax.class_||'—'}</span>
          <span class="bdg bt">${tax.order_||'—'}</span>
          <span class="bdg bv">${tax.family||'—'}</span>
          ${sp.conservation_status ? `<span class="bdg ba">${sp.conservation_status}</span>` : ''}
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab')[0].classList.add('on');
  rtab('general');
}

// ── GRAPH SVG ─────────────────────────────────────────────────────────────
function buildGraph(sp, img) {
  const W=800,H=380,cx=W/2,cy=H/2,R=148;
  const nodes=[...(sp.vocalisations||[]).map(v=>({l:v,t:'v'})),...(sp.contexts||[]).map(c=>({l:c,t:'c'})),...(sp.functions||[]).map(f=>({l:f,t:'f'}))];
  const cols={v:{f:'rgba(232,164,39,.15)',s:'rgba(232,164,39,.6)',tx:'#e8a427'},c:{f:'rgba(44,184,138,.12)',s:'rgba(44,184,138,.5)',tx:'#2cb88a'},f:{f:'rgba(155,142,240,.12)',s:'rgba(155,142,240,.5)',tx:'#9b8ef0'}};
  const total=nodes.length||1;
  const uid=sp.species_id;
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
    <defs><clipPath id="cc_${uid}"><circle cx="${cx}" cy="${cy}" r="56"/></clipPath></defs>`;
  nodes.forEach((n,i)=>{const a=((i/total)*360-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);o+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${cols[n.t].s}" stroke-width="1" opacity=".4" stroke-dasharray="3,4"/>`;});
  o+=`<circle cx="${cx}" cy="${cy}" r="60" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)" stroke-width=".5"/>`;
  if(img)o+=`<image href="${img}" x="${cx-56}" y="${cy-56}" width="112" height="112" clip-path="url(#cc_${uid})" preserveAspectRatio="xMidYMid slice"/>`;
  else{o+=`<circle cx="${cx}" cy="${cy}" r="56" fill="#1e2028"/>`;o+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#454854">${sp.taxonomy?.class_||'—'}</text>`;}
  o+=`<circle cx="${cx}" cy="${cy}" r="56" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>`;
  o+=`<text x="${cx}" y="${cy+76}" text-anchor="middle" font-family="DM Serif Display,serif" font-size="13" fill="#e8e9ec">${sp.common_name_en}</text>`;
  nodes.forEach((n,i)=>{const a=((i/total)*360-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),col=cols[n.t],lbl=n.l.length>18?n.l.slice(0,17)+'…':n.l,w=Math.min(130,Math.max(64,lbl.length*6.6+16));o+=`<rect x="${(x-w/2).toFixed(1)}" y="${(y-13).toFixed(1)}" width="${w.toFixed(1)}" height="26" rx="13" fill="${col.f}" stroke="${col.s}" stroke-width=".8"/>`;o+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9.5" fill="${col.tx}">${lbl}</text>`;});
  [{t:'v',l:'vocalisation'},{t:'c',l:'context'},{t:'f',l:'function'}].forEach((leg,i)=>{const col=cols[leg.t];o+=`<circle cx="21" cy="${H-46+i*16}" r="4" fill="${col.f}" stroke="${col.s}" stroke-width=".8"/>`;o+=`<text x="32" y="${H-42+i*16}" font-family="DM Sans,sans-serif" font-size="9" fill="#454854">${leg.l}</text>`;});
  return o+'</svg>';
}

// ── TABS ──────────────────────────────────────────────────────────────────
function stab(name, btn) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); rtab(name);
}

function rtab(name) {
  const sp = currentSp; if (!sp) return;
  const tc = document.getElementById('tc');
  const img = sp.image?.url || '';
  const tax = sp.taxonomy || {};

  if (name === 'general') {
    tc.innerHTML = `
      <div class="gw">${buildGraph(sp, img)}</div>
      <div class="igrid">
        <div class="ic"><label>class</label><span>${tax.class_||'—'}</span></div>
        <div class="ic"><label>order</label><span>${tax.order_||'—'}</span></div>
        <div class="ic"><label>family</label><span>${tax.family||'—'}</span></div>
        <div class="ic"><label>conservation</label><span>${sp.conservation_status||'—'}</span></div>
        <div class="ic" style="grid-column:span 2"><label>sources</label>
          ${sp.wiki_url?`<a href="${sp.wiki_url}" target="_blank">Wikipedia →</a>`:''}
          ${sp.inat_id?` &nbsp;·&nbsp; <a href="https://www.inaturalist.org/taxa/${sp.inat_id}" target="_blank" style="color:var(--amber)">iNaturalist →</a>`:''}
          ${sp.gbif_usage_key?` &nbsp;·&nbsp; <a href="https://www.gbif.org/species/${sp.gbif_usage_key}" target="_blank" style="color:var(--amber)">GBIF →</a>`:''}
        </div>
      </div>
      ${sp.summary?`<p class="wb">${sp.summary}</p>`:''}
      <p class="ws">Sources: GBIF · iNaturalist · Wikipedia · Zoe.Logos-Graph v0.1.2</p>`;

  } else if (name === 'communication') {
    tc.innerHTML = `
      <div class="gw">${buildGraph(sp, img)}</div>
      <div class="cs"><div class="cl">vocalisation types</div><div class="tags">${(sp.vocalisations||[]).map(v=>`<span class="tg tv">${v}</span>`).join('')||'<span class="lm">none recorded</span>'}</div></div>
      <div class="cs"><div class="cl">behavioural contexts</div><div class="tags">${(sp.contexts||[]).map(c=>`<span class="tg tc">${c}</span>`).join('')}</div></div>
      <div class="cs"><div class="cl">putative functions</div><div class="tags">${(sp.functions||[]).map(f=>`<span class="tg tf">${f}</span>`).join('')}</div></div>`;

  } else if (name === 'evidence') {
    let html = '';

    // Open-access literature from seed
    if (sp.open_papers?.length) {
      html += `<div class="cs"><div class="cl">open-access literature</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:1.5rem">` +
        sp.open_papers.map(p => `<a href="${p.url}" target="_blank" style="font-size:13px;color:var(--amber);text-decoration:none;display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(232,164,39,.3);border-radius:4px;padding:2px 6px">DOI</span>
          ${p.doi}</a>`).join('') + `</div></div>`;
    }

    // Pilot paper records
    if (!sp.papers?.length) {
      html += `<div class="nop">No extraction records in the pilot dataset for <em>${sp.common_name_en}</em>.<br>Add abstracts to <code>data/raw/abstracts.json</code> and run the extraction pipeline.</div>`;
    } else {
      html += `<div class="cs"><div class="cl">extracted pilot records</div><div>` + sp.papers.map(p => {
        const gs = `https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}`;
        return `<div class="pc">
          <div class="pt" onclick="window.open('${gs}','_blank')">${p.title}</div>
          <div class="pau">${sp.common_name_en} · animal communication study</div>
          <div class="pm">${p.year||'—'} · stage: ${p.stage||'—'} · ${p.id}</div>
          ${p.outcome?`<div class="po">"${p.outcome}"</div>`:''}
          <div class="pacts">
            <a class="pact" href="${gs}" target="_blank">Google Scholar ↗</a>
            <button class="pact" onclick='showExport(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>Cite</button>
            <button class="pact" onclick='dlBib(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>BibTeX ↓</button>
            <button class="pact" onclick='dlRIS(${JSON.stringify(p)},${JSON.stringify(sp.scientific_name)})'>RIS ↓</button>
          </div>
        </div>`;
      }).join('') + `</div></div>`;
    }
    tc.innerHTML = html;

  } else if (name === 'media') {
    tc.innerHTML = `<div class="lm">loading audio…</div>`;
    renderMedia(sp, tc);
  }
}

// ── MEDIA ─────────────────────────────────────────────────────────────────
function renderMedia(sp, tc) {
  const audio = sp.audio || {};
  const img = sp.image?.url;

  let html = '';

  // Image
  if (img) {
    html += `<div class="cs"><div class="cl">image</div>
      <img src="${img}" style="max-width:100%;border-radius:10px;margin-bottom:6px;border:1px solid var(--border)" alt="${sp.common_name_en}">
      <div style="font-size:11px;color:var(--hint)">Source: ${sp.image.source||'Wikimedia Commons'} · ${sp.image.license||'see source'}</div>
    </div>`;
  }

  // Audio
  html += `<div class="cs"><div class="cl" style="margin-top:1rem">audio & spectrograms</div>`;
  const provider = audio.provider || 'external_links';
  if (audio.recordings?.length) {
    const providerLabel = provider === 'xeno_canto' ? 'Xeno-canto · CC licensed' :
                          provider === 'freesound'   ? 'Freesound.org · see individual licenses' : 'recordings';
    html += `<p style="font-size:11px;color:var(--hint);margin-bottom:1rem">${audio.recordings.length} recordings · ${providerLabel}</p>`;
    html += audio.recordings.map(r => {
      const isXC  = provider === 'xeno_canto';
      const isFS  = provider === 'freesound';
      return `<div class="ac">
        <div class="am"><strong>${r.type||r.name||'vocalisation'}</strong>${r.cnt?' · '+r.cnt:''}${r.loc?', '+r.loc:''}${r.description?' · '+r.description:''}<br>
        ${r.rec?'rec: '+r.rec:''}${r.author?' · '+r.author:''}${r.date?' · '+r.date:''}${r.duration?' · '+r.duration+'s':''}</div>
        ${r.sono?`<img class="sono" src="${r.sono}" alt="spectrogram" onerror="this.style.display='none'">`:''}
        ${r.audio?`<audio controls preload="none" onerror="this.style.display='none'"><source src="${r.audio}" type="audio/mpeg"></audio>`:''}
        ${r.url?`<a class="xcl" href="${r.url}" target="_blank">${isXC?'XC'+r.id+' on Xeno-canto':isFS?'View on Freesound':'source'} →</a>`:''}
        ${r.license?`<div style="font-size:10px;color:var(--hint);margin-top:4px">${r.license}</div>`:''}
      </div>`;
    }).join('');
  } else if (audio.external_links?.length) {
    html += `<div class="extlinks">` + audio.external_links.map(l => `<a href="${l.url}" target="_blank">${l.name} →</a>`).join('') + `</div>`;
  } else {
    html += `<div class="noaud">No audio available for this species yet.</div>`;
  }
  html += `</div>`;
  tc.innerHTML = html;
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function makeBib(p, sci) {
  return `@article{${p.id}_${p.year||'n.d.'},\n  title   = {${p.title}},\n  author  = {[see source]},\n  year    = {${p.year||'n.d.'}},\n  note    = {Stage: ${p.stage||'—'}. Species: ${sci}}\n}`;
}
function makeRIS(p, sci) {
  return `TY  - JOUR\nTI  - ${p.title}\nPY  - ${p.year||''}\nKW  - animal communication\nKW  - ${sci}\nN1  - Stage: ${p.stage||'—'}\nER  -`;
}
function showExport(p, sci) {
  const pop = document.createElement('div'); pop.className = 'epop'; pop.id = 'epop';
  pop.innerHTML = `<div class="ebox"><h3>${p.title.slice(0,55)}…</h3><pre>${makeBib(p,sci)}</pre><div class="ebtns"><button class="eb ebp" onclick="dlBib(${JSON.stringify(p)},${JSON.stringify(sci)})">BibTeX ↓</button><button class="eb ebp" onclick="dlRIS(${JSON.stringify(p)},${JSON.stringify(sci)})">RIS ↓</button><button class="eb ebg" onclick="document.getElementById('epop').remove()">close</button></div></div>`;
  document.body.appendChild(pop);
  pop.addEventListener('click', e => { if(e.target===pop) pop.remove(); });
}
function dlBib(p, sci) { dl(makeBib(p,sci), p.id+'.bib'); }
function dlRIS(p, sci) { dl(makeRIS(p,sci), p.id+'.ris'); }
function dl(content, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:'text/plain'}));
  a.download = filename; a.click();
}

// ── BACK ──────────────────────────────────────────────────────────────────
function goBack() {
  document.getElementById('dv').style.display = 'none';
  document.getElementById('sv').style.display = 'block';
  window.scrollTo(0, 0);
  currentSp = null;
  const hbg = document.getElementById('habitat-bg');
  const hov = document.getElementById('habitat-ov');
  if (hbg) hbg.style.opacity = '0';
  if (hov) hov.style.opacity = '0';
}

// ── INIT ──────────────────────────────────────────────────────────────────
loadIndex();
</script>
